summary_beginner: "A Bronze Age urban civilisation of the Indus valley and beyond, known only from archaeology: planned brick cities such as Harappa, Mohenjo-daro, Dholavira and Lothal, with seals bearing a script that is still undeciphered."
summary_scholar: "Named after Harappa, where inscribed seals were first excavated; Marshall's 1931 report set out its urban character. Archaeology alone defines this culture. Links between Harappan sites and Vedic or Puranic places and peoples are debated and are not asserted in KALA. Marshall argued that the Indus and Vedic cultures differ sharply (no horse or iron, iconic cults against an aniconic Vedic religion) and that the Indus civilisation was pre-Vedic; others have argued otherwise. KALA records the disagreement and takes no side."
