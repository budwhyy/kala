summary_beginner: "The age in which the Vedas were composed and handed down orally. It is dated only from the texts themselves, so its dates are rough scholarly estimates."
summary_scholar: "A textual period, not an archaeological culture: its dates are inferred from language and doctrine. Macdonell's 1900 estimates are given with his own caveats. Identifying Vedic peoples or places with particular archaeological sites, including Harappan ones, is debated and is not asserted here."
