  note: "Macdonell (1900) calls Vedic chronology altogether conjectural, based only on internal evidence. He puts its beginning perhaps as early as 1500 BC, the oldest hymns perhaps 1300-1000 BC, and the lower limit of the second stratum no later than 500 BC (the latest phase reaching about 200 BC). He records and rejects higher estimates (2000 BC; Jacobi's 4000 BC). These are literary datings, not archaeology."
