summary_scholar: "The Vishnu Purana lists ten Shungas from Pushpamitra to Devabhuti and gives them 112 years. Pargiter's text gives the same count and total with reigns king by king; the Vayu and Brahmanda give Pushyamitra 60 years where the Matsya gives 36. The Puranic account is kept apart from the historical Shunga polity."
