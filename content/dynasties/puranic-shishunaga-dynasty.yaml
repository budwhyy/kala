summary_scholar: "The Vishnu Purana gives ten Shaishunagas and 362 years. Pargiter notes the readings 360 (Brahmanda, Bhagavata) and 362 (Vayu, Vishnu) and argues the Matsya's original figure was 163. His text also has Udayin found Kusumapura on the south bank of the Ganges. These are the texts' claims, not historical dates."
