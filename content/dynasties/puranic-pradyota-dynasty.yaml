summary_beginner: "In the Puranas' prophecy, five kings beginning with Pradyota, son of the minister who killed the last Barhadratha."
summary_scholar: "The Vishnu Purana lists Pradyota, Palaka, Vishakhayupa, Janaka and Nandivardhana and gives them 138 years. Pargiter's text calls the fourth king Ajaka, gives each reign separately and also totals them at 138 years, noting other readings (for example 152 in some copies). The minister's name differs between the Puranas (Sunika, Munika, Pulika)."
