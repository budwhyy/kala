summary_beginner: "In the Puranas' prophecy, the Andhra kings, beginning with Shipraka or Simuka, who overthrow the last Kanva."
summary_scholar: "The Vishnu Purana says thirty Andhrabhritya kings will reign 456 years but names twenty-four, ending with Pulomarchis. Pargiter's collated text names thirty kings and gives 460 years; Wilson reports that the Matsya has 29 kings and 460 years. Many names in these lists are Satakarnis and Pulumavis. The Puranic account is separate from the historical Satavahana polity."
