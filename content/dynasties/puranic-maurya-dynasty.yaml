summary_beginner: "In the Puranas' prophecy, the kings Kautilya establishes after uprooting the Nandas, beginning with Chandragupta."
summary_scholar: "The Vishnu Purana names ten Mauryas (Chandragupta, Bindusara, Ashokavardhana, Suyashas, Dasharatha, Sangata, Shalishuka, Somasharman, Shashadharman, Brihadratha) and gives them 137 years. Pargiter's collated text gives two lists: one of ten kings and one (Vayu and Brahmanda) of nine, both totalling 137 years, with different names after Ashoka (Kunala, Bandhupalita and others). This is the Puranic account; the historical Maurya polity is a separate record."
