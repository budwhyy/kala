summary_scholar: "The Vishnu Purana names Vasudeva, Bhumimitra, Narayana and Susharman and gives them 45 years; Wilson notes that some earlier lists read 345 but his copies read 45. Pargiter's text gives the same four with reigns of 9, 14, 12 and 10 years and calls them servants of the Shungas (Shungabhrityas)."
