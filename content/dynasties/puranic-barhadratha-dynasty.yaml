summary_beginner: "In the Puranas' prophecy of the Kali age, the line of Jarasandha's son Sahadeva that rules Magadha from Girivraja after the Bharata war."
summary_scholar: "The Vishnu Purana names Somapi and twenty-one kings after Sahadeva, ending with Ripunjaya, and says the line will last a thousand years. In Pargiter's collated Matsya-Vayu text the reign lengths are given king by king; the text speaks of sixteen kings lasting 723 years and also of thirty-two kings lasting a full thousand years. These are the texts' own figures, not historical dates."
