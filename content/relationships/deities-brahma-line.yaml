- id: brahma-father-of-bhrigu-mbh
  from: brahma
  to: bhrigu
  type: parent
  role: father
  mode: other
  variant: mahabharata-adi-parva
  explanation: "In the Mahabharata, Bhrigu comes out by splitting open Brahma's breast, rather than being born from his mind."
  references:
    - source: ganguli-mahabharata
      locator: "1.66"
- id: brahma-father-of-daksha-vp
  from: brahma
  to: daksha
  type: parent
  role: father
  mode: mind_born
  variant: vishnu-purana-account
  explanation: "The Vishnu Purana's account of the first creation counts Daksha among Brahma's mind-born sons. A later chapter has him born again as the son of the Prachetasas, which is not entered here because the Prachetasas have no record yet."
  references:
    - source: wilson-vishnu-purana
      locator: "1.7"
    - source: wilson-vishnu-purana
      locator: "1.15"
      note: "Says Daksha had formerly been a son of Brahma before his birth to the Prachetasas and Marisha."
- id: brahma-father-of-svayambhuva-manu
  from: brahma
  to: svayambhuva-manu
  type: parent
  role: father
  mode: other
  variant: vishnu-purana-account
  explanation: "In the Vishnu Purana Brahma forms the first Manu out of his own original self, and makes the female part of himself into Shatarupa."
  references:
    - source: wilson-vishnu-purana
      locator: "1.7"
- id: brahma-father-of-shiva-vp
  from: brahma
  to: shiva
  type: parent
  role: father
  mode: other
  variant: vishnu-purana-account
  explanation: "In the Vishnu Purana, Rudra springs from Brahma's forehead when Brahma becomes angry; the next chapter says this is the Rudra who married Sati. Shaiva texts see Shiva as unborn and supreme, so this belongs to the Vishnu Purana's account only."
  references:
    - source: wilson-vishnu-purana
      locator: "1.7"
    - source: wilson-vishnu-purana
      locator: "1.8"
- id: marichi-father-of-kashyapa
  from: marichi
  to: kashyapa
  type: parent
  role: father
  mode: biological
  explanation: "Kashyapa is the son of Marichi, in the Mahabharata and in the pedigree of Rama's line in Valmiki's Ramayana."
  references:
    - source: ganguli-mahabharata
      locator: "1.65"
    - source: ganguli-mahabharata
      locator: "1.75"
    - source: griffith-ramayana
