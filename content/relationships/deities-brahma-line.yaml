- id: brahma-father-of-marichi
  from: brahma
  to: marichi
  type: parent
  role: father
  mode: mind_born
  explanation: "Marichi is one of the sons Brahma produces from his mind, in both the Vishnu Purana's list of nine and the Mahabharata's list of six."
  references:
    - source: wilson-vishnu-purana
      locator: "1.7"
    - source: ganguli-mahabharata
      locator: "1.65"
    - source: griffith-ramayana
      locator: "1.70"
      note: "Names Marichi as a son of Brahma, without saying how he was born."
