- id: indra-member-of-adityas
  from: indra
  to: adityas
  type: member_of
  explanation: "Both the Mahabharata and the Vishnu Purana name Shakra (Indra) among the twelve Adityas, the sons of Aditi."
  references:
    - source: ganguli-mahabharata
      locator: "1.65"
    - source: wilson-vishnu-purana
      locator: "1.15"

