- id: dharma-father-of-vasus
  from: dharma
  to: vasus
  type: parent
  role: father
  mode: biological
  variant: groups-vasus-vishnu-purana
  explanation: "In the Vishnu Purana the Vasus are the children of Dharma's wife Vasu, one of the ten daughters of Daksha given to Dharma. (The Mahabharata instead makes them sons of Prajapati, a son of Manu, who has no record yet.)"
  references:
    - source: wilson-vishnu-purana
      locator: "1.15"

- id: brahma-father-of-dharma
  from: brahma
  to: dharma
  type: parent
  role: father
  mode: other
  variant: mahabharata-adi-parva
  explanation: "In the Mahabharata Dharma, in human form, comes out of Brahma's right breast."
  references:
    - source: ganguli-mahabharata
      locator: "1.66"

- id: brahma-father-of-sthanu
  from: brahma
  to: sthanu
  type: parent
  role: father
  mode: mind_born
  variant: mahabharata-adi-parva
  explanation: "The Mahabharata names Sthanu as a further spiritual son of Brahma, besides the six great rishis."
  references:
    - source: ganguli-mahabharata
      locator: "1.66"

- id: sthanu-father-of-rudras
  from: sthanu
  to: rudras
  type: parent
  role: father
  mode: other
  variant: mahabharata-adi-parva
  explanation: "In the Mahabharata the eleven Rudras are the sons of Sthanu. The Vishnu Purana lists eleven Rudras but does not name their father."
  references:
    - source: ganguli-mahabharata
      locator: "1.66"
