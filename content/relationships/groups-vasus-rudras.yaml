- id: dhruva-vasu-member-of-vasus
  from: dhruva-vasu
  to: vasus
  type: member_of
  explanation: "Both the Mahabharata and the Vishnu Purana name Dhruva among the eight Vasus."
  references:
    - source: ganguli-mahabharata
      locator: "1.66"
    - source: wilson-vishnu-purana
      locator: "1.15"

