- id: vasishtha-member-of-saptarishis-vp-vaivasvata
  from: vasishtha
  to: saptarishis
  type: member_of
  variant: deities-saptarishis-vishnu-purana-vaivasvata
  explanation: "The Vishnu Purana names Vasishtha among the seven rishis of the present age, that of Vaivasvata Manu."
  references:
    - source: wilson-vishnu-purana
      locator: "3.1"

