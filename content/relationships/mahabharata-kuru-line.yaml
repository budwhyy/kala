# Kuru line from Kuru to the sons of Vichitravirya (Ganguli's Adi Parva).
# The two genealogies in Adi Parva sections 94 and 95 differ between Kuru and Pratipa; each carries its own variant.
- id: mbh-pratipa-descendant-of-kuru
  from: pratipa
  to: kuru
  type: descendant_of
  variant: mahabharata-people-kuru-line-adi-94
  explanation: "In the Adi Parva's first genealogy Kuru's line runs through his son Avikshit and a king Janamejaya to a king Dhritarashtra, and Pratipa is the most famous of that Dhritarashtra's grandsons. The passage does not name every link or count the generations."
  references:
    - source: ganguli-mahabharata
      locator: "1.94"
- id: mbh-kuru-father-of-viduratha-kuru
  from: kuru
  to: viduratha-kuru
  type: parent
  role: father
  mode: biological
  variant: mahabharata-people-kuru-line-adi-95
  explanation: "Kuru marries Subhangi, a princess of the Dasarhas, and has a son, Viduratha."
  references:
    - source: ganguli-mahabharata
      locator: "1.95"
