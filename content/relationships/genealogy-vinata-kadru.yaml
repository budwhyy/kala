- id: kashyapa-father-of-garuda
  from: kashyapa
  to: garuda
  type: parent
  role: father
  mode: biological
  explanation: "Garuda is born from Kashyapa's boon to Vinata of two mighty sons."
  references:
    - source: ganguli-mahabharata
      locator: "1.16"
    - source: wilson-vishnu-purana
      locator: "1.21"
