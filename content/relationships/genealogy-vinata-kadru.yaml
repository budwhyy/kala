- id: kadru-curse-nagas
  from: kadru
  to: nagas
  type: curse
  explanation: "When her serpent sons refuse to help her cheat in the wager with Vinata, Kadru curses them to burn in King Janamejaya's snake sacrifice."
  references:
    - source: ganguli-mahabharata
      locator: "1.20"
- id: garuda-enemy-of-nagas
