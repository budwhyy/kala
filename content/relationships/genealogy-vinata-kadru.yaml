- id: aruna-curse-vinata
  from: aruna
  to: vinata
  type: curse
  explanation: "Born half-formed because Vinata broke his egg early, Aruna curses her to be a slave until his brother frees her."
  references:
    - source: ganguli-mahabharata
      locator: "1.16"
    - source: ganguli-mahabharata
      locator: "1.34"
      note: "Garuda recalls the curse of Aruna"
