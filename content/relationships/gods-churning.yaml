- id: vishnu-father-of-dhanvantari-harivamsha
  from: vishnu
  to: dhanvantari
  type: parent
  role: father
  mode: other
  variant: gods-harivamsha-account
  explanation: In the Harivamsha, Dhanvantari rises from the ocean, calls himself Vishnu's son and is addressed by Vishnu as his son.
  references:
    - source: dutt-harivamsha
      locator: "29"
- id: vishnu-blessing-dhanvantari
  from: vishnu
  to: dhanvantari
  type: blessing
  variant: gods-harivamsha-account
  explanation: Vishnu names him Avja, promises him a second birth as a king who will spread Ayurveda, and says he will be worshipped by the twice-born.
  references:
    - source: dutt-harivamsha
      locator: "29"
- id: airavata-vahana-of-indra
  from: airavata
  to: indra
  type: vahana_of
  explanation: Airavata is the elephant on which Indra rides in the Vishnu Purana's story of Durvasas's garland, and in the Mahabharata Indra takes him when he rises from the ocean.
  references:
    - source: wilson-vishnu-purana
      locator: "1.9"
    - source: ganguli-mahabharata
      locator: "1.18"
- id: uchchaihshravas-vahana-of-indra
  from: uchchaihshravas
  to: indra
  type: vahana_of
  explanation: The translators' notes identify the churning's divine horse as Indra's horse (Griffith's note calls it Indra's horse; Wilson's note says Indra took it). The main text of the Mahabharata passage does not say who takes it.
  references:
    - source: griffith-ramayana
      locator: "1.45"
      note: Griffith's footnote.
    - source: wilson-vishnu-purana
      locator: "1.9"
      note: Wilson's footnote 8.
- id: bhadramana-mother-of-airavata
  from: bhadramana
  to: airavata
  type: parent
  role: mother
  mode: biological
  variant: gods-mahabharata-krodha-daughters-line
  explanation: In the Mahabharata's list of the offspring of Krodha's daughters, Bhadramana bears the celestial elephant Airavata. This sits beside the Mahabharata's own telling that Airavata rises at the churning.
  references:
    - source: ganguli-mahabharata
      locator: "1.66"
- id: varuna-father-of-varuni
  from: varuna
  to: varuni
  type: parent
  role: father
  mode: biological
  explanation: Sura (Varuni) is Varuna's daughter, in the Ramayana and in the Mahabharata's genealogy.
  references:
    - source: griffith-ramayana
      locator: "1.45"
    - source: ganguli-mahabharata
      locator: "1.66"
- id: lakshmi-blessing-indra
  from: lakshmi
  to: indra
  type: blessing
  explanation: Pleased by Indra's hymn, Shri (Lakshmi) promises never to leave the three worlds again and never to turn from those who recite his hymn.
  references:
    - source: wilson-vishnu-purana
      locator: "1.9"
