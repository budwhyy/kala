- id: mbh-devaki-mother-of-balarama
  from: devaki
  to: balarama
  type: parent
  role: mother
  mode: biological
  explanation: "Balarama is conceived as Devaki's seventh child; Yoganidra draws the embryo from her womb, which is why he is called Sankarshana. The Vishnu Purana's chapter heading counts him among Vasudeva's sons by Devaki."
  references:
    - source: wilson-vishnu-purana
      locator: "4.15"
    - source: wilson-vishnu-purana
      locator: "5.1"
