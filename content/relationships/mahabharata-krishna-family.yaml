# Krishna's family and the Yadavas (Wilson's Vishnu Purana Books 4-5, Dutt's Harivamsha, Ganguli's Mahabharata).
# Balarama's two mothers follow the embryo-transfer story: Devaki biological (conception), Rohini other (birth).
- id: mbh-vasudeva-shura-partner-devaki
  from: vasudeva-shura
  to: devaki
  type: partner
  explanation: "Vasudeva marries Devaki, daughter of Devaka; Kamsa drives their chariot after the wedding."
  references:
    - source: wilson-vishnu-purana
      locator: "5.1"
    - source: wilson-vishnu-purana
      locator: "4.14"
    - source: dutt-harivamsha
      locator: "37"
- id: mbh-vasudeva-shura-partner-rohini
  from: vasudeva-shura
  to: rohini
  type: partner
  explanation: "Rohini is one of Vasudeva's wives; the Harivamsha calls her the first and most beloved."
  references:
    - source: wilson-vishnu-purana
      locator: "4.15"
    - source: dutt-harivamsha
      locator: "35"
- id: mbh-vasudeva-shura-father-of-krishna
