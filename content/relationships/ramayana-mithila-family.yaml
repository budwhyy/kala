- id: janaka-father-of-sita
  from: janaka
  to: sita
  type: parent
  role: father
  mode: adoptive
  explanation: "Janaka finds the infant Sita in the furrow while ploughing and takes her as his daughter; in Sita's own telling a voice from the sky confirms her as his child and his chief queen raises her. The text names no other parent and says she was not born of a mortal mother."
  references:
    - source: griffith-ramayana
      locator: "1.66"
    - source: griffith-ramayana
      locator: "2.118"
- id: janaka-father-of-urmila
  from: janaka
  to: urmila
  type: parent
  role: father
  mode: biological
  explanation: "Urmila is Janaka's daughter, the younger sister of Sita; the text does not describe her birth."
  references:
