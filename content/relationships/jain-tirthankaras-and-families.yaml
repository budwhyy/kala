- id: "jain-yashoda-partner-mahavira"
  from: "yashoda-jain"
  to: "mahavira"
  type: "partner"
  variant: "jain-mahavira-family-acaranga"
  explanation: "The Acaranga Sutra names Yashoda as Mahavira's wife; the Kalpa Sutra also mentions his life as a householder before marriage. Only the Svetambara canon was read for this claim."
  references:
    - source: "jacobi-jaina-sutras-1"
      locator: "Akaranga Sutra II, 15, 15, p. 193"
    - source: "jacobi-jaina-sutras-1"
      locator: "Kalpa Sutra, section 112, p. 257"
