- id: "jain-devananda-first-mother-of-mahavira"
  from: "devananda"
  to: "mahavira"
  type: "parent"
  role: "mother"
  mode: "other"
  variant: "jain-embryo-transfer-svetambara"
  explanation: "In the Svetambara canon Mahavira is first conceived in Devananda's womb before the embryo is moved to Trishala; the Digambaras reject this account."
  references:
    - source: "jacobi-jaina-sutras-1"
      locator: "Kalpa Sutra, section 2, p. 219"
    - source: "jacobi-jaina-sutras-1"
      locator: "Kalpa Sutra, section 21, p. 226-227"
    - source: "jacobi-jaina-sutras-1"
      locator: "Introduction, p. xxxi"
      note: "Footnote 2."
