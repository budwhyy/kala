licence_note: "Verified from the scan: the translator's preface is dated Calcutta, 12 June 1908 (archive.org item in.ernet.dli.2015.33648, a 1987 reprint of the 1908 edition). Translator 1855-1912 (same life dates already recorded for his other translations in docs/SOURCES.md), so public domain in the USA, UK/EU and India. Publisher/printer not confirmed from the scan. Chapter numbering is Dutt's own (the tirtha chapter is his chapter 81, pp. 209-212); it may differ from the chapter numbers of Sanskrit editions. Do not confuse with the Saroddhara translation by Wood and Subrahmanyam (1911, Sacred Books of the Hindus vol. 9): that translator died in 1965 and it is NOT usable."
