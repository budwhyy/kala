licence_note: "Verified: this one-volume revised edition was published at Allahabad in 1883 (title
  page read in the archive.org scan, Digital Library of India item 2015.43864); the first edition
  appeared in parts from 1877. Published before 1931, so public domain in the US; translator
  F. S. Growse d. 1893, so public domain in the UK/EU. Locator: book.doha, i.e. Growse's book
  number (I Childhood ... VII The Sequel) and the doha (couplet) number he prints; a passage given as
  3.19 is the chaupai stanza printed after Doha 19. Growse's doha numbers are his own and do not
  always match modern Hindi editions."
