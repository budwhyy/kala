licence_note: "Verified from the scan (Google Books copy on archive.org, item bub_gb_dD9n-vePuh0C, title page 'Select Works ... London: Trübner & Co., 1861'). Wilson 1786-1860, editor Rost 1822-1896: public domain in the USA, UK/EU and India. Wilson's essay first appeared in Asiatic Researches vols 16-17 (Calcutta, 1828 and 1832) and was reprinted as a separate volume at the Bishop's College Press, Calcutta, 1846. Locator is the page of the 1861 edition. The 1861 edition prints a bracketed editorial insertion in Wilson's list of twelve lingas (item 9), absent from the 1846 reprint; cite it as the editor's addition."
