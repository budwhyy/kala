summary_beginner: "King of Chedi, son of Damaghosha and of Vasudeva's sister, and so Krishna's cousin. He insults Krishna at Yudhishthira's royal consecration and Krishna kills him with his discus. Both the Mahabharata and the Vishnu Purana say he had been the asura Hiranyakashipu in an earlier birth."
summary_scholar: "The Vishnu Purana adds a middle birth as Ravana and explains why only his death as Shishupala united him with Vishnu (4.14-4.15). In the Mahabharata Krishna promises Shishupala's mother, his aunt, to pardon a hundred offences (2.42)."
