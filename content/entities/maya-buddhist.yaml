summary_beginner: In Buddhist texts, the queen of Suddhodana and mother of the future Buddha, who
  gives birth to him in the Lumbini grove. The Nidanakatha says she died seven days after the birth
  and was reborn in the Tusita heaven; the Buddhacarita says she went to heaven, unable to bear the
  joy of his birth.
