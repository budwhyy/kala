summary_beginner: A Danava who slipped in among the gods to drink amrita. The Sun and Moon exposed him and Narayana cut off his head, which stays immortal and, according to the Mahabharata, still swallows the Sun and Moon at eclipses.
summary_scholar: MBh 1.65 makes Rahu a son of Sinhika, a daughter of Daksha and wife of Kashyapa; this is not entered as a relationship because no Sinhika record exists yet. Wilson's note to VP 1.9 observes that the Vishnu Purana text does not tell the Rahu story, and describes the beheading as the simplest and oldest form of the legend, with Ketu an afterthought.
