summary_beginner: The deadly poison that rises during the churning. In the Mahabharata and the Ramayana, Shiva swallows it to save the worlds, and is called Nilakantha, the blue-throated one, from then on.
summary_scholar: "The Vishnu Purana (1.9) says only that poison appeared and was taken by the Nagas; Wilson's note identifies it with Halahala or Kalakuta. The Mahabharata and the Ramayana disagree on the circumstances: in the Mahabharata it appears late and Brahma asks Shiva to swallow it, in the Ramayana it comes first, from the serpent's venom, and Vishnu invites Shiva to take it as the eldest god's first share."
