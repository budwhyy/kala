summary_beginner: The god of fire. In the lists of the Vasus given in the Mahabharata and the Vishnu Purana, fire appears among the eight, and both texts call the war-god Kumara (Kartikeya) the son of Agni, born in a clump of reeds.
summary_scholar: MBh 1.66 glosses the Vasu Anala as Hutasana, an epithet of Agni; VP 1.15 glosses both Dhava and Anala as fire, so the identification is left open there. In VP 1.9 the god of fire (Hutasana) goes with Indra and the gods to Brahma. Agni's role as father of Kartikeya has a different telling in the Vana Parva, entered under Shiva and Parvati.
