summary_beginner: "A king of Ikshvaku's line at Ayodhya. In Vasishtha's recital of Rama's ancestry in Valmiki's Ramayana he is the son of Bhagiratha and the father of Raghu. Rama is often called Kakutstha after him, as the Ayodhya Kanda recital points out."
