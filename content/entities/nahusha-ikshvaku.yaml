summary_beginner: "A king of Ikshvaku's line at Ayodhya, son of Ambarisha. Vasishtha's recital in the Bala Kanda makes him the father of Yayati; the recital in the Ayodhya Kanda makes him the father of Nabhaga. A king of Ikshvaku's line; the recital does not identify him with the Nahusha of the lunar line."
