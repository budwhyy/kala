summary_beginner: "King of Magadha, whose two daughters, Asti and Prapti, married Kamsa. After Kamsa's death he attacked Mathura again and again; in the Mahabharata Bhima kills him in single combat, with Krishna and Arjuna present."
summary_scholar: "The Adi Parva says he was the Danava Viprachitti born as a man (1.67). The Magadha kingdom of the epic has its own record."
