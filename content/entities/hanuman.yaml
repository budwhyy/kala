summary_beginner: "A vanara chief and Sugriva's counsellor, son of the wind god and of Anjana. In Valmiki's Ramayana he leaps the ocean to Lanka, finds Sita and burns the city, and he is revered in living Vaishnava devotion as Rama's devoted servant."
