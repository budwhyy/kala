summary_beginner: "A king of Ikshvaku's line at Ayodhya. In Vasishtha's recital of Rama's ancestry in Valmiki's Ramayana he is the son of Prithu and the father of Dhundhumara. The Bala Kanda tells how the sage Vishvamitra, by the power of his austerities, sent him bodily towards heaven and made new stars for him when the gods cast him down."
