summary_beginner: "King of Mathura, son of Ugrasena and cousin of Devaki. Warned that Devaki's eighth child would kill him, he imprisoned her and Vasudeva and killed their children; Krishna kills him in the wrestling arena."
summary_scholar: "Devaki's father Devaka and Kamsa's father Ugrasena are brothers in both the Vishnu Purana (4.14) and the Harivamsha (37), which makes Kamsa her paternal cousin. Both the Mahabharata (1.67) and the Vishnu Purana (5.1) say he was the asura Kalanemi born again."
