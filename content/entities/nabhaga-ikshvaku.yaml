summary_beginner: "A king of Ikshvaku's line at Ayodhya and the father of Aja, Dasharatha's father. Vasishtha's two recitals in Valmiki's Ramayana disagree about his father: Yayati in the Bala Kanda, Nahusha in the Ayodhya Kanda. The Ayodhya Kanda recital names a second son, Suvrata."
