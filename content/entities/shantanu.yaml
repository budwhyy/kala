summary_beginner: "A Kuru king at Hastinapura, son of Pratipa. By the goddess Ganga he is the father of Bhishma, and by Satyavati the father of Chitrangada and Vichitravirya."
summary_scholar: "The Adi Parva says he was the king Mahabhisha, reborn on earth under a curse of Brahma (1.96). He grants Bhishma the boon of dying only when he chooses (1.100) and brings up the abandoned twins Kripa and Kripi out of pity (1.130). Ganguli spells the name Santanu."
