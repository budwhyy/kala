summary_beginner: "A king of Ikshvaku's line at Ayodhya. In Vasishtha's recital of Rama's ancestry in Valmiki's Ramayana he is the son of Asita and the father of Asamanja. His name is explained by the poison (gara) a rival queen gave his mother before his birth; the Bala Kanda tells how his sixty thousand sons dug into the earth searching for his sacrificial horse."
