summary_beginner: "A fisherman's foster-daughter who ferried travellers on the Yamuna. By the sage Parashara she became the mother of Vyasa, and as King Shantanu's queen the mother of Chitrangada and Vichitravirya."
summary_scholar: "In the Adi Parva she is born from a fish (a cursed apsara) that had swallowed the seed of King Uparichara Vasu, and is given to the fishermen to raise (1.63). When Vichitravirya dies childless she calls on Vyasa to father children for the Kuru line (1.105-1.106). Section 95 also calls her Gandhakali."
