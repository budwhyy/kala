summary_beginner: "The aged king of the bears, who marches with Sugriva's host and, as an elder of the southern search party, urges Hanuman to make the leap to Lanka."
summary_scholar: "Griffith 1.16 has Brahma say he formerly made 'the lord of bears' from his yawning mouth, without naming him; the link to Jambavan is not stored."
