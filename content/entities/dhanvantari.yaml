summary_beginner: The physician of the gods, who rises from the ocean at the churning carrying the cup of amrita, the drink of immortality. Medicine (Ayurveda) is said to have been taught by him.
summary_scholar: He appears in the Mahabharata (1.18), the Vishnu Purana (1.9) and the Ramayana (1.45, with Griffith's note calling him the gods' physician). The Harivamsha (Dutt, chapter 29) adds that Vishnu named him Avja ('water-born'), accepted him as a son, and promised him a second birth as a king of Kashi who would spread Ayurveda; Wilson's VP 3.6 lists medicine among the branches of knowledge 'as taught by Dhanwantari'. The Kashi king of the Harivamsha is told as Dhanvantari's second birth and is not yet a separate record.
