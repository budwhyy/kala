summary_beginner: "The first Tirthankara of the present age in Jain teaching. The Kalpa Sutra calls him the Kosalian, son of the patriarch Nabhi and Marudevi, the first king, first mendicant and first Tirthankara, who taught people writing, arithmetic and the arts before renouncing his kingdom."
summary_scholar: "The Kalpa Sutra (sections 204-227) gives his life; he reached liberation on Mount Ashtapada. He is a Jain figure in his own right: the Rishabha of the Bhagavata Purana's avatar list is a separate Hindu account and no identification is stored here."
