summary_beginner: "The five sons of Pandu: Yudhishthira, Bhima and Arjuna, born to Kunti, and the twins Nakula and Sahadeva, born to Madri, each fathered by a god. Their struggle with their cousins the Kauravas is the main story of the Mahabharata."
