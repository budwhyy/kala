summary_beginner: "A Yadava, son of Shura, also called Anakadundubhi. He is the father of Krishna by Devaki and of Balarama and Subhadra through Rohini; his sister Pritha (Kunti) is the mother of the Pandavas."
summary_scholar: "The Vishnu Purana names his father as Shura, son of Devamidhusha, and lists his brothers and sisters (4.14) and his wives (4.15); the Harivamsha lists fourteen wives (35). Ganguli's Mahabharata usually reserves the name Vasudeva for Krishna himself, the son of Vasudeva."
