summary_beginner: "A child of Drupada, born a daughter and later turned into a man by a yaksha. In the Udyoga Parva Shikhandi is Amba reborn to destroy Bhishma, and in the war Arjuna attacks Bhishma from behind Shikhandi."
summary_scholar: "The Mahabharata gives two origins: the Adi Parva's list of incarnations calls Shikhandi a rakshasa born among men (1.67), while Bhishma's account in the Udyoga Parva makes Shikhandi the reborn Amba (5.190-5.191). Only the second is stored as a relationship."
