summary_beginner: "The third Maurya emperor, whose rock and pillar edicts, the oldest deciphered Indian inscriptions, describe his conquest of Kalinga, his remorse and his policy of dhamma."
summary_scholar: "The edicts call him Devanampriya Priyadarsi; the Maski edict names him Asoka, settling Prinsep's identification. Hultzsch's working dates: coronation 264 BC, Kalinga conquered eight years later, a visit to Sambodhi (Bodh Gaya) ten years after; Smith dates his accession about 273 and coronation 269 BC. The Rummindei pillar records his visit to Lumbini as the Buddha's birthplace. Later Buddhist legend (the Ceylon chronicles, the Ashokavadana) tells much more; those claims are not taken as history here."
