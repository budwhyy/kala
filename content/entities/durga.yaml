summary_beginner: >-
  The warrior form of the Goddess, called Chandika, Ambika and Durga, who defeats the buffalo demon Mahisha and the
  demons Shumbha and Nishumbha in the Devi Mahatmya. Shaktas worship her as the Great Goddess herself; other texts
  describe her in other ways, for example as the power of Vishnu who is born as the daughter of Yashoda.
summary_scholar: >-
  The Devi Mahatmya (Markandeya Purana) says the goddess takes birth when she reveals herself to help the gods, and that
  Chandika is formed from the combined energies of the gods. In the Shumbha episode Ambika issues from the body of Parvati,
  who becomes dark and is called Kalika. The Mahabharata's two hymns (Virata Parva and Bhishma Parva) address Durga
  with the names Kali, Mahakali, Uma, Shakambhari and Saraswati and also call her born of Yashoda; the Vishnu Purana
  (5.1) makes the same goddess Yoganidra, the illusory power of Vishnu, who is born to Yashoda, slays Shumbha and
  Nishumbha and is called Durga, Ambika and Bhadrakali. The Devi Bhagavata calls the supreme Goddess Bhagavati Durga (3.6)
  and, in a second scheme, makes Durga the first of five forms of Prakriti (9.1).
