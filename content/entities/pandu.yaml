summary_beginner: "Son of Vichitravirya's widow Ambalika through Vyasa, named for his pale colour. Cursed never to approach his wives, he asked Kunti and Madri to bear sons by gods; the five Pandavas count as his sons."
summary_scholar: "In 1.95 he shoots a sage who had taken the form of a deer and is cursed to die in the act of love, which later happens with Madri. Before the curse he conquers many kingdoms for the Kurus (1.113)."
