summary_beginner: "A king of Ikshvaku's line at Ayodhya. In Vasishtha's recital of Rama's ancestry in Valmiki's Ramayana he is the son of Bharata (son of Dhruvasandhi) and the father of Sagara. Defeated by the Haihayas, Talajanghas and Shashabindus, he fled to the Himalaya with his two wives and died there."
