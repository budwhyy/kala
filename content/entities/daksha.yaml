summary_beginner: "A patriarch (prajapati, 'lord of creatures') whose many daughters marry gods and sages and become mothers of much of creation. Texts differ on his birth: born from Brahma's mind in one chapter of the Vishnu Purana, son of the Prachetasas in another and in the Mahabharata."
