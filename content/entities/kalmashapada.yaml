summary_beginner: "A king of Ikshvaku's line at Ayodhya. In Vasishtha's recital of Rama's ancestry in Valmiki's Ramayana he is the son of Raghu and the father of Shankhana. Griffith gives him the name Purushadaka, the man-eater, and explains Kalmashapada as 'spotted feet'."
