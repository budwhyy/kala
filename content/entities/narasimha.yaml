epithets:
  - text: The Man-Lion
    lang: en
    script: Latn
kinds: [deity]
traditions: [vaishnava, puranic, itihasa]
summary_beginner: >-
  The half-man, half-lion form of Vishnu who kills the Daitya king Hiranyakashipu. In the Harivamsha, Hiranyakashipu
  gets a boon from Brahma that makes him almost impossible to kill and then oppresses the gods, so Vishnu takes this
  unusual form. The Vishnu Purana tells the story from the side of Hiranyakashipu's devout son Prahlada.
summary_scholar: >-
  The Vishnu Purana mentions the killing very briefly (1.20), and Wilson notes that among the Puranas he knew the story of
  the pillar from which the form emerges is told in detail only in the Bhagavata. The Harivamsha places the event in the
  golden age (Krita Yuga) and spells out the boon, and the Mahabharata's Narayana lists the man-lion among his coming
  forms.
references:
  - source: wilson-vishnu-purana
    locator: "1.20"
    note: "Hiranyakashipu is put to death by Vishnu in the man-lion form; Wilson's note says the detailed story is in the Bhagavata."
  - source: dutt-harivamsha
    locator: "41"
    note: "Hiranyakashipu's boon from Brahma; Vishnu takes a half-lion, half-man form and kills him in the golden age."
  - source: ganguli-mahabharata
    locator: "12.340"
  - source: dutt-bhagavata-purana
    locator: "1.3"
    note: "Fourteenth form: tears the lord of the demons with his nails."
  - source: dutt-bhagavata-purana
    locator: "2.7"
