summary_beginner: "The twenty-fourth and last Tirthankara of the present age in Jain teaching. Named Vardhamana by his parents Siddhartha and Trishala, he left home, practised austerities for twelve years, reached omniscience (kevala) and taught until his liberation at the town of Papa."
summary_scholar: "The Kalpa Sutra's Life of Mahavira (sections 1-147) and the Acaranga Sutra (II, 15) are the Svetambara canon's accounts. Jacobi (SBE 22, Introduction, pp. xv-xvii) argues from Jain and Buddhist sources that Mahavira was a historical person, a contemporary of the Buddha known to Buddhist texts as Nataputta; no dates are stored here because the sources read do not fix them."
