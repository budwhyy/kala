summary_beginner: The divine craftsman, maker of the gods' chariots and ornaments. He is the son of Prabhasa, the eighth Vasu, and the sister of Brihaspati; in the Vishnu Purana he is the father of Sanjna, wife of the Sun.
summary_scholar: MBh 1.66 and VP 1.15 agree on his parentage. VP 3.2 has him trim the Sun's glare on a lathe and fashion Vishnu's discus, Shiva's trident and other weapons from the shavings. MBh 2.8 says he built Yama's assembly hall. VP 1.15 also gives the name of his mother as Yogasiddha, which the Mahabharata does not.
