summary_beginner: "A wife of Vasudeva who lived at Gokula. The Vishnu Purana and the Harivamsha say that Devaki's seventh conception was moved into her womb, so that she bore Balarama; the Harivamsha also makes her the mother of Subhadra."
summary_scholar: "The Harivamsha calls her the first and most beloved of Vasudeva's fourteen wives and a daughter of Valhika of Puru's race (35)."
