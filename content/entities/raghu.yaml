summary_beginner: "A king of Ikshvaku's line at Ayodhya. In Vasishtha's recital of Rama's ancestry in Valmiki's Ramayana he is the son of Kakutstha and the father of Kalmashapada. Rama and his brothers are called Raghavas, sons of Raghu, after him."
