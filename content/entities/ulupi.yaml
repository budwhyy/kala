kinds: [naga]
traditions: [itihasa]
summary_beginner: "Daughter of Kauravya, a Naga king of Airavata's line. She drew Arjuna into the Naga realm during his pilgrimage and gave him a boon; long afterwards she urges her stepson Babruvahana to fight Arjuna and revives Arjuna with a gem."
