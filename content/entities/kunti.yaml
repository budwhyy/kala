summary_beginner: "Pritha, daughter of the Yadava chief Shura and sister of Vasudeva, was given as a child to her father's cousin Kuntibhoja, hence the name Kunti. With a mantra from the sage Durvasa she bore Karna by the Sun before her marriage and, as Pandu's wife, Yudhishthira, Bhima and Arjuna by the gods Dharma, Vayu and Indra."
summary_scholar: "Because Vasudeva is her brother, his son Krishna is the Pandavas' cousin. The Vishnu Purana gives the same parentage and the same divine fathers (4.14). The Adi Parva says she was born of a portion of the goddess Siddhi (1.67)."
