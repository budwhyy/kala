summary_beginner: "A king of Ikshvaku's line at Ayodhya. In Vasishtha's recital of Rama's ancestry in Valmiki's Ramayana he is the son of Dilipa and the father of Kakutstha. Through his austerities the river Ganga comes down from heaven to purify the ashes of Sagara's sons."
