summary_beginner: >-
  The Yadava prince raised among cowherds who is central to the Mahabharata and to the fifth book of the Vishnu Purana.
  Vaishnavas worship him as Vishnu born on earth to lighten Earth's burden. Texts describe the relation differently: the
  Vishnu Purana speaks of a portion of Vishnu descending, while the Bhagavata Purana says the other forms are portions
  but Krishna is the Lord himself.
summary_scholar: >-
  The Vishnu Purana (5.1) has Vishnu pluck a black hair and a white one and promise that his hair will be born in
  Devaki's eighth conception. Wilson notes that the Mahabharata describes Krishna in inconsistent ways, sometimes as a
  portion of Vishnu and sometimes as Vishnu or Narayana himself. In the Bhagavata list (1.3) he is the twentieth form,
  with Rama (Balarama) the nineteenth, and the text adds that he is the Lord himself. The Santi Parva list and the
  Harivamsha list both include him.
