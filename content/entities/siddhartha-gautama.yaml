    end: -400
    precision: period
    confidence: low
    note: Lifetime somewhere in this window, which spans the Ceylon chronicle reckoning (death 543
      BCE, birth eighty years earlier) and Rhys Davids' proposal (death about 420-400 BCE). The dates
      are debated and none is established.
