summary_beginner: The teacher whom Buddhists call the Buddha, the Awakened One. Buddhist texts tell
  of his birth as a prince of the Sakyas at Lumbini, his leaving home, his awakening under the
  Bo-tree, his teaching and his passing away at Kusinara. He is a historical person; the stories
  about him are the tradition's own and are given here as such.
summary_scholar: This is the historical teacher of Buddhism, distinct from the buddha-avatar of
  some Puranic lists. His dates are not known. Rhys Davids (1881) shows that the Ceylon chronicles
  place his death in 543 BCE by a reckoning he regards as unreliable, rejects a later correction to
  about 485 BCE, and himself proposed about 420-400 BCE for the death and about 500 BCE for the birth
  (he lived eighty years). The range below spans only these views from the source read; later
  scholarship, not consulted here, continues to debate them.
