summary_beginner: "The twenty-four Jinas of the present age in Jain teaching: teachers who conquered passion, reached omniscience and showed the way across rebirth. The first is Rishabha and the last Mahavira."
summary_scholar: "Jacobi notes that the belief in twenty-four Tirthankaras is common to Digambaras and Svetambaras (Introduction, p. xxxv). They are Jain figures and are not the avatars of Hindu lists."
