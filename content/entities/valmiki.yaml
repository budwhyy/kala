summary_beginner: "The sage to whom the Ramayana is attributed. In the opening books he composes the poem and teaches it to Rama's sons Kusha and Lava; in the Uttara Kanda Sita lives in his hermitage, where the twins are born."
summary_scholar: "In Dutt 7.109 Valmiki calls himself the tenth son of Prachetas; Prachetas is not entered. Macdonell (1900, p. 305) notes that the poet appears as Rama's contemporary only in the first and last books."
