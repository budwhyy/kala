summary_beginner: "A Kshatriya woman of the Vasishtha gotra, wife of Siddhartha and mother of Mahavira; the Acaranga Sutra also calls her Videhadatta and Priyakarini. In the Kalpa Sutra she sees fourteen dreams when Mahavira enters her womb."
