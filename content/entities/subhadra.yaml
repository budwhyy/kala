summary_beginner: "Daughter of Vasudeva and sister of Krishna and Balarama. With Krishna's encouragement Arjuna carried her off from Dwaraka and married her; their son was Abhimanyu."
summary_scholar: "The Harivamsha says her name was Chitra and that she was Rohini's daughter (35); in the Mahabharata Krishna calls her the full sister of Sarana (1.221), whom the Vishnu Purana lists among Rohini's sons (4.15)."
