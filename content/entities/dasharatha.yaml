summary_beginner: "King of Ayodhya and father of Rama, Bharata, Lakshmana and Shatrughna by his three queens Kausalya, Kaikeyi and Sumitra. Bound by two boons he once granted Kaikeyi, he sends Rama into exile and dies of grief soon after."
