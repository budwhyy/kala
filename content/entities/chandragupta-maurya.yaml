summary_beginner: "Founder of the Maurya empire, who took power in Magadha after Alexander's invasion and made peace with Seleucus."
summary_scholar: "Known from Greek writers (Megasthenes was sent to his court) and Indian traditions; Rudradaman's Girnar inscription names his governor Pushyagupta, who built the Sudarshana lake. Hultzsch's working dates: about 320-296 BC; Smith puts the accession in 322 BC. The Puranas and the Ceylon chronicles agree on a reign of 24 years."
