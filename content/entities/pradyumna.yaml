summary_beginner: "Son of Krishna and Rukmini. Stolen as an infant by the demon Sambara, he grew up to kill him and returned to Dwaraka; he is the father of Aniruddha."
summary_scholar: "The Adi Parva says he was the sage Sanatkumara born as a man (1.67). The Sabha Parva says he learned arms from Arjuna (2.4)."
