summary_beginner: "A king of Ikshvaku's line at Ayodhya. In Vasishtha's recital of Rama's ancestry in Valmiki's Ramayana he is the son of Nahusha (Ikshvaku line) and the father of Nabhaga. He appears only in the Bala Kanda recital; the Ayodhya Kanda recital passes straight from Nahusha to Nabhaga. The recital does not identify him with Yayati of the lunar line."
references:
  - source: griffith-ramayana
    locator: "1.70"
  - source: dutt-ramayana
