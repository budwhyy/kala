summary_beginner: "A prince of Gandhara, son of King Subala and brother of Gandhari. He is Duryodhana's adviser and plays the dice game that costs Yudhishthira his kingdom; Sahadeva kills him at the end of the war."
summary_scholar: "The Adi Parva says he was Dvapara, the third age, born as a man (1.67). The kingdom of Gandhara has its own record."
