summary_beginner: "Ravana's son, a warrior skilled in illusion who once defeated Indra. In the war at Lanka he twice brings down Rama and Lakshmana with his arrows before Lakshmana kills him."
summary_scholar: "Griffith passes over Indrajit's last battle and death in a prose note at the end of 6.75; 6.93 has Ravana's lament for him. The Uttara Kanda (Dutt 7.12) says he was born to Mandodari and first named Meghanada for his thunderous cry."
