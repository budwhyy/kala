summary_beginner: "Dharma personified as a god. In the Mahabharata he comes out of Brahma's right breast and marries ten daughters of Daksha; in the Vishnu Purana he also marries ten of Daksha's daughters, one of whom, Vasu, is the mother of the Vasus."
