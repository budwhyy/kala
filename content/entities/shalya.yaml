summary_beginner: "King of Madra and brother of Madri, and so uncle of Nakula and Sahadeva. Won over by Duryodhana's hospitality, he fought for the Kauravas, led their army on the last day, and was killed by Yudhishthira."
summary_scholar: "The Adi Parva says he was the asura Samhlada, younger brother of Prahlada, born as a man (1.67). In 5.8 Ganguli's text calls him Duryodhana's maternal uncle."
