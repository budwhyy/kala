summary_beginner: The lord of wealth and king of the Yakshas. The Mahabharata calls him a son of Pulastya and describes his shining assembly hall, where Shiva visits as his friend.
summary_scholar: MBh 2.10 (Narada's description of Kubera's hall) states that he is Pulastya's son, that Vibhishana honours him as his elder brother, and that Shiva became his friend. VP 1.8, in the extract from the Vayu Purana that Wilson appends to the chapter, places Kuvera on Kailasa among Shiva's retinue. Other fathers for Kubera appear in other works, and Wilson's note to VP 1.10 reports the Bhagavata's version; those are not entered.
