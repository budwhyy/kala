summary_beginner: A Daitya, son of Prahlada and father of Bali. The Mahabharata and the Vishnu Purana give the same descent.
summary_scholar: MBh 1.65 gives him two brothers, Kumbha and Nikumbha. VP 1.21 passes directly from Prahlada to Virochana to Bali.
