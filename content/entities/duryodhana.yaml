summary_beginner: "Eldest son of Dhritarashtra and Gandhari and leader of the Kauravas. His rivalry with the Pandavas, which starts with an attempt to poison Bhima, leads to the dice game and the war, in which Bhima breaks his thighs."
summary_scholar: "The Adi Parva says he was born of a portion of Kali, here the spirit of the age of strife and not the goddess Kali (1.67). He makes Karna king of Anga to win his friendship (1.138)."
