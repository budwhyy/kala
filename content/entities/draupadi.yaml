summary_beginner: "Daughter of King Drupada of Panchala, who rose from the altar of his sacrifice. Won by Arjuna, she became the wife of all five Pandavas; her humiliation in the dice hall is a turning point of the epic."
summary_scholar: "She is named Krishna (the dark one) at her birth (1.169); Ganguli's translation often calls her Krishna or Panchali. The Adi Parva says she was born of a portion of Sachi, Indra's queen (1.67). Each Pandava weds her on a successive day (1.200)."
