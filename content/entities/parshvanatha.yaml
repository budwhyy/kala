summary_beginner: "The twenty-third Tirthankara in Jain teaching. In the Kalpa Sutra he is born at Benares to King Ashvasena and Queen Vama, lives thirty years as a householder, becomes omniscient after eighty-four days of meditation, and reaches liberation on Mount Sammeta at the age of a hundred."
summary_scholar: "Kalpa Sutra, sections 149-169. The Acaranga Sutra says Mahavira's parents were worshippers of Parshva (II, 15, 16)."
