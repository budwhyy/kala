summary_beginner: In the Cullavagga, Devadatta hires men to kill the Buddha, but they are converted.
  He hurls a rock from the Vulture's Peak near Rajagaha; two peaks close and only a splinter wounds the
  Buddha's foot. He has the fierce elephant Nalagiri loosed in the street, but the Buddha calms it with
  love. At last he tells Ananda he will hold the order's ceremonies apart, and splits the order.
