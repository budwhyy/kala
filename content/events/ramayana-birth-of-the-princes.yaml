summary_beginner: "In Valmiki's Ramayana, after King Dasharatha's sacrifice for sons, his three queens give birth in Ayodhya: Kausalya to Rama, Kaikeyi to Bharata, and Sumitra to the twins Lakshmana and Shatrughna. The sage Vasishtha names them, and the city celebrates."
summary_scholar: "Griffith 1.19. The canto says Rama was born from half of Vishnu's vigour and Bharata from a fourth, with Lakshmana and Shatrughna also sharing in Vishnu's essence. Macdonell (p. 304), following Jacobi, regards Book I as a later addition, like Book VII; Book I events are nevertheless kept under the Valmiki account here, as only Book VII is tagged as a later layer."
