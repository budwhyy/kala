summary_beginner: "In Tulsidas's Ramcharitmanas, while Lakshmana is away, Rama tells Sita that he is about to play a human part and asks her to stay within fire until the demons are destroyed. She enters the fire, leaving an image of herself exactly like her; Lakshmana does not know. Then Maricha appears as the deer, and Ravana carries off Sita, as in Valmiki's telling."
summary_scholar: "Growse 3.19 (the chaupai after Doha 19) and 3.24 (the abduction and Jatayu's fight). Valmiki's Ramayana has no such exchange. The poem goes on calling the captive Sita by her name."
