summary_beginner: In the Nidanakatha the Buddha walks from the Bo-tree to the hermitage at Isipatana
  near Benares. The five ascetics who had left him rise to greet him despite themselves, and he
  teaches them his first discourse; Kondanya is the first to understand, and the other four follow
  over the next days.
