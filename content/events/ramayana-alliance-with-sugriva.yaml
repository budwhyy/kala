summary_beginner: "From Rishyamukha hill the exiled vanara Sugriva sees the two armed princes by Lake Pampa and sends Hanuman to find out who they are. Hanuman brings them to Sugriva, and Rama and Sugriva swear friendship walking round a kindled fire: Rama will help Sugriva against his brother Vali, and Sugriva will help find Sita."
