summary_beginner: "In heaven Yudhishthira finds Duryodhana seated in glory and his own brothers absent. He insists on going where they are and is led to a dark, terrible place where he hears their voices crying out, and chooses to stay with them. The scene vanishes: Indra tells him that every king must see hell, and it was an illusion. He bathes in the heavenly Ganga, leaves his human body and joins his kin."
summary_scholar: "Svargarohanika Parva, Ganguli 18.1-18.4; 18.5 tells where each hero goes after death. Svarga is a cosmological place with no coordinates. The 'position' in narrative_order is parva x 1000 + Ganguli's section number of the main passage, so events sort in the order the epic tells them."
