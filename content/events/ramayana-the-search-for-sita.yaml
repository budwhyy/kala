summary_beginner: "After the rains Sugriva sends vanara armies to search the east, south, west and north. Rama gives Hanuman his ring for Sita. The southern party under Angada reaches the sea without success, until the old vulture Sampati, Jatayu's brother, tells them that Ravana holds Sita in Lanka across the water."
