summary_beginner: "Pandu cannot father children, so Kunti uses the mantra Durvasa gave her. She calls the god of justice, Dharma, and bears Yudhishthira; then the wind god Vayu, and bears Bhima; then Indra, and bears Arjuna. At Pandu's request she shares the mantra with Madri, who calls the twin Ashvins and bears the twins Nakula and Sahadeva."
summary_scholar: "Ganguli 1.123 (Yudhishthira, Bhima, Arjuna) and 1.124 (Nakula and Sahadeva). Pandu is the legal father and the gods the divine fathers; the genealogy records store them as different modes of parenthood. The 'position' in narrative_order is parva x 1000 + Ganguli's section number of the main passage, so events sort in the order the epic tells them."
