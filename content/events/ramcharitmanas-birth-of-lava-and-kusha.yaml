summary_beginner: "In the Ramcharitmanas there is no exile of Sita. During Rama's reign Sita serves the household in Ayodhya and bears two sons, Lava and Kusha; Rama's brothers also each have two sons."
summary_scholar: "Growse 7.25-7.26 (p. 511). Contrast the Uttara Kanda of Valmiki's Ramayana, where the twins are born at Valmiki's hermitage after Sita is sent away."
