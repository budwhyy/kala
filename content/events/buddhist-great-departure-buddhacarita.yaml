summary_beginner: In Asvaghosha's poem the prince mounts his white horse at night; the barred gates
  open silently, and looking back he vows not to enter the city again until he has seen the far
  shore of birth and death. At sunrise he reaches a hermitage, dismounts and speaks to his groom
  Chandaka.
