summary_beginner: "The army marches south, and Rama climbs Mount Mahendra before reaching the shore. Faced with the sea, Rama threatens it with his arrows; the Ocean rises and tells him that Nala, son of Vishvakarma, can build a bridge. The vanaras build it across the sea, and the army crosses to Lanka."
