summary_beginner: In the Nidanakatha the prince looks in on his sleeping wife and son but does not
  wake them, and rides out at midnight on Kanthaka with Channa holding the tail. Mara tempts him with
  empire and he refuses. At the river Anoma he cuts off his hair, which Sakka enshrines in the
  Tavatimsa heaven, puts on a mendicant's robes and sends Channa home; Kanthaka dies of grief and is
  reborn as a god.
