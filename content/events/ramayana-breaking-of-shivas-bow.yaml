summary_beginner: "At Mithila King Janaka shows the princes a great bow that once belonged to Shiva and that no king could even lift. Janaka has vowed his daughter Sita, found in a furrow of the earth, to the man who can string it. Rama bends it until it snaps with a thunderous crash, and Janaka promises Sita to him."
