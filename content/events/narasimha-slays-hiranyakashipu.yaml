summary_beginner: >-
  The Daitya king Hiranyakashipu wins a boon from Brahma that protects him from almost every kind of death and then
  oppresses the gods. In the Harivamsha the gods appeal to Vishnu, who takes the form of a half-lion, half-man and kills
  him. The Vishnu Purana tells the story through his son Prahlada, who keeps faith in Vishnu, and states that the king was
  finally put to death by Vishnu as the man-lion.
summary_scholar: >-
  The Vishnu Purana (1.17-1.20) spends most of its space on Prahlada's trials and mentions the killing only in a sentence
  (1.20). Wilson notes that the Bhagavata tells at length of the pillar and the conflict. The Harivamsha gives Hiranyakashipu's
  list of immunities from Brahma in detail. The Santi Parva has Narayana say he will take the man-lion form to kill
  Hiranyakashipu, son of Diti, who is destroying sacrifices.
