summary_beginner: "When the princes' training is complete, Drona holds a public display of their skill. Arjuna outshines everyone until Karna enters the arena, repeats his feats and challenges him. Told that Arjuna need not fight one who is not a king, Duryodhana has Karna crowned king of Anga on the spot. When the old charioteer Adhiratha comes in and Karna bows to him as his father, Bhima mocks Karna's birth."
summary_scholar: "Ganguli 1.136-1.139. The scene founds the friendship of Karna and Duryodhana and the rivalry of Karna and Arjuna; the crowning makes Anga Karna's kingdom in the epic. The 'position' in narrative_order is parva x 1000 + Ganguli's section number of the main passage, so events sort in the order the epic tells them."
