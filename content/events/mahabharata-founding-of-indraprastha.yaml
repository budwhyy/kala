summary_beginner: "Now allied by marriage to Panchala, the Pandavas are recalled to Hastinapura after Bhishma, Drona and Vidura urge Dhritarashtra to give them their share. He sends them with half the kingdom to Khandavaprastha, a wild tract. With Krishna at their side and Vyasa's help in choosing the site, they build a splendid city that comes to be called Indraprastha."
summary_scholar: "Viduragamana Parva, Ganguli 1.205-1.209: Bhishma's (1.205), Drona's (1.206) and Vidura's (1.207) advice, and the grant and founding (1.209). The 'position' in narrative_order is parva x 1000 + Ganguli's section number of the main passage, so events sort in the order the epic tells them."
