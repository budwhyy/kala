summary_beginner: "Duryodhana has his minister Purochana build a house at Varanavata out of lac, hemp, resin and other things that burn easily, and Dhritarashtra sends the Pandavas there for a festival. Warned by Vidura, they have a tunnel dug. One night they set the house on fire themselves and escape with Kunti; a Nishada woman and her five sons, who had fallen asleep there after a feast, die in the fire, so the city believes the Pandavas are dead. A boat sent by Vidura carries them across the Ganga into the forest."
summary_scholar: "Jatugriha Parva, Ganguli 1.143-1.151: the plan and the building (1.146), the tunnel (1.148), the fire and the Nishada family (1.150), and Vidura's boat on the Ganga (1.151). B. B. Lal records the identification of Varanavata with Barnawa (see the place record). The 'position' in narrative_order is parva x 1000 + Ganguli's section number of the main passage, so events sort in the order the epic tells them."
