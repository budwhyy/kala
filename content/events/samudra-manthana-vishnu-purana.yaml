summary_beginner: In the Vishnu Purana the sage Durvasas gives Indra a garland; Indra's elephant Airavata throws it down, and Durvasas curses Indra to lose his power. The Daityas overthrow the weakened gods, who go to Vishnu. He tells them to make peace with the Daityas and churn the sea of milk with Mandara and Vasuki, while he himself bears the mountain as a tortoise. Many things rise, among them the goddess Shri, Dhanvantari with the cup of amrita, and Vishnu in a female form recovers the amrita and gives it to the gods, who regain heaven.
summary_scholar: Vishnu Purana 1.9, told by Parashara to Maitreya as the story of Lakshmi. The Durvasas episode is not in the Mahabharata or Ramayana accounts; Wilson's footnote 8 calls it an embellishment, observes that the churning is absent or brief in several Puranas, and lists the products of the ocean as the sources give them. In this account Vishnu promises the Daityas an equal share but plans that they will only toil, and the Nagas take the poison instead of Shiva. Its sequence of products is stored as the Vishnu Purana list variant. Shri is also Bhrigu's daughter in the same chapter, and the text says her ocean birth was a later one. No yuga or manvantara is given. The 'position' in narrative_order is the Book 1 chapter number.
