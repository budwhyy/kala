summary_beginner: "Before Yudhishthira can perform the royal consecration (Rajasuya), Krishna tells him that Jarasandha of Magadha dominates the kings of the earth. Kamsa had married Jarasandha's daughters, and after Krishna killed Kamsa, Jarasandha attacked the Yadavas, who left Mathura and fortified a new city in the west, Kusasthali, called Dwaravati. Krishna, Bhima and Arjuna go to Jarasandha's capital Girivraja, where Bhima wrestles with him and breaks his body in two."
summary_scholar: "Sabha Parva, Ganguli 2.14 (Krishna's account, including the flight from Mathura to Kusasthali near the Raivata hills) and 2.20-2.24 (the journey to Girivraja and the fight). The Harivamsha and the Vishnu Purana tell Jarasandha's attacks on Mathura at greater length (VP 5.22-5.23). The 'position' in narrative_order is parva x 1000 + Ganguli's section number of the main passage, so events sort in the order the epic tells them."
