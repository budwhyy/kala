summary_beginner: "In the Harivamsha, Krishna persuades the cowherds of Vrindavana to stop their festival for Indra. Angered, Indra orders his clouds to drown the herds. Krishna uproots Mount Govardhana and holds it up with his left hand like an umbrella, and the cowherds shelter beneath it with their cattle and carts until Indra calls off the rain. Indra then comes to praise him."
summary_scholar: "Dutt, Harivamsha Parva chs. 70-72 (the dispute over Indra's festival), 73 (the storm and the lifting) and 74 (Indra's praise). The 'position' in narrative_order is the chapter number of Dutt's Harivamsha Parva."
