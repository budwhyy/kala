summary_beginner: "Vishvamitra tells the princes how the sage Gautama cursed his wife Ahalya after Indra came to her in disguise: she would live unseen in the hermitage until Rama came. When Rama enters the grove she is freed, the gods praise her, and Gautama takes her back."
