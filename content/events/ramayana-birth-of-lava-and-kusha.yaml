summary_beginner: "In the Uttara Kanda, on the night Shatrughna stays at Valmiki's hermitage, Sita gives birth to twin sons. Valmiki protects them with rites using the tip and the lower part of kusha grass, which give the boys their names, Kusha and Lava."
summary_scholar: "Dutt 7.79. Tagged with the Uttara Kanda variant: Uttara Kanda (Book VII), which scholars generally regard as a later addition to Valmiki's poem. Macdonell (p. 304) also regards the names Kusha and Lava as a popular etymology of the word kushilava, bard. In the Ramcharitmanas the twins are born in Ayodhya."
