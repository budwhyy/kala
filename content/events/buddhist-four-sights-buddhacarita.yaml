summary_beginner: In Asvaghosha's poem gods create an old man, a sick man and a corpse in the
  prince's path, and his charioteer explains each. Later, while the prince sits in meditation, a man
  in a beggar's dress appears, and the prince then asks his father's leave to become a wandering
  mendicant.
