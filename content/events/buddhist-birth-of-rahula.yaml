summary_beginner:
  In the Nidanakatha, on the day of the fourth sight, King Suddhodana sends word that
  the mother of Rahula has borne a son. The prince says that a bond has come into being, and the
  king names the child Rahula from that saying. In the Buddhacarita, by contrast, Rahula is born
  earlier, before the sights.
