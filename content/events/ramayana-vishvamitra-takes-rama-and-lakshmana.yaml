summary_beginner: "The sage Vishvamitra comes to Ayodhya and asks King Dasharatha for Rama, to guard his sacrifice from demons sent by Ravana. The king, who loves Rama most, at first refuses; Vasishtha persuades him to keep his promise, and Rama leaves with Lakshmana behind the sage."
