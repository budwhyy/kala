summary_beginner: "Rama flies home in the aerial chariot Pushpaka, pointing out to Sita the places of their journey. He stops at Bharadvaja's hermitage and sends Hanuman ahead. At Nandigrama Bharata meets him and places the sandals back on his feet, and in Ayodhya Rama is consecrated king."
