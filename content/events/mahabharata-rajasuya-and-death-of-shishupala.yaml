summary_beginner: "After his brothers have brought the kings of every direction under his sway, Yudhishthira performs the Rajasuya. On Bhishma's advice the first guest-offering goes to Krishna. Shishupala, king of Chedi, objects and abuses Krishna and Bhishma. Bhishma tells how Krishna promised Shishupala's mother, his aunt, to pardon a hundred of her son's offences. When the number is full, Krishna cuts off Shishupala's head with his discus."
summary_scholar: "Sabha Parva, Ganguli 2.25-2.31 (the conquests), 2.35 (the first offering), 2.42 (Shishupala's birth and the boon) and 2.44 (his death). Shishupala had served as Jarasandha's commander (2.14). The 'position' in narrative_order is parva x 1000 + Ganguli's section number of the main passage, so events sort in the order the epic tells them."
