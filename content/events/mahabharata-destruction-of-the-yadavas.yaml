summary_beginner: "In the thirty-sixth year after the war, young Vrishnis dress Samba as a pregnant woman to mock visiting sages, who curse him to bear an iron bolt that will destroy his race. The Yadavas go to Prabhasa by the sea, drink, quarrel and kill one another. Balarama leaves his body as a great white serpent that enters the ocean, and Krishna, lying in yoga, is shot in the heel by a hunter named Jara. Arjuna leads the women and survivors away, and the sea floods Dwaraka behind them."
summary_scholar: "Mausala Parva, Ganguli 16.1 (the curse), 16.3 (the fight at Prabhasa), 16.4 (Balarama and Krishna; Krishna recalls Gandhari's curse) and 16.7 (Arjuna's departure, the flooding of Dwaraka and the Abhira raiders). The Vishnu Purana tells the same end in its own way (VP 5.37), recorded as a separate event. The 'position' in narrative_order is parva x 1000 + Ganguli's section number of the main passage, so events sort in the order the epic tells them."
