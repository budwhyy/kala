summary_beginner: "In the final duel Rama shoots the arrow that the sage Agastya had given him, made by Brahma for Indra, and it pierces Ravana's heart. Ravana falls, his army scatters and flowers fall from heaven. His queens mourn him, and Vibhishana is consecrated king of Lanka."
