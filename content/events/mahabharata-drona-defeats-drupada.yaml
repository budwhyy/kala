summary_beginner: "As his teacher's fee, Drona asks his pupils to bring him King Drupada of Panchala. The Kuru princes march on Drupada's capital; when the first attack fails, Arjuna and his brothers defeat the Panchalas and capture the king. Drona keeps the northern half of Panchala, with Ahicchatra, and gives Drupada back the south. Drupada rules from Kampilya on the Ganga and begins searching for a way to gain a son who could defeat Drona."
summary_scholar: "Ganguli 1.140. The passage is the epic's main statement of the division of Panchala (north with Ahicchatra to Drona; south, up to the Charmanwati, to Drupada at Kampilya) and of Drupada's enmity with Drona. The 'position' in narrative_order is parva x 1000 + Ganguli's section number of the main passage, so events sort in the order the epic tells them."
