summary_beginner: "Ravana forces the rakshasa Maricha to help him. Maricha takes the form of a wondrous golden deer near the hermitage; Sita longs for it and Rama chases it far into the forest. Struck by Rama's arrow, Maricha cries out in Rama's voice for Sita and Lakshmana, and Sita drives a reluctant Lakshmana to go to Rama's aid."
