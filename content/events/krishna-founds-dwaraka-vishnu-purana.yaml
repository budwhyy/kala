summary_beginner: "In the Vishnu Purana, Jarasandha of Magadha attacks Mathura eighteen times and is driven off each time. When Kalayavana also marches against it, Krishna asks the ocean for land, builds the fortified city of Dwaraka and moves the people of Mathura there. He then lures Kalayavana into the cave of the sleeping king Muchukunda, whose glance burns him up."
summary_scholar: "Wilson VP 5.22 (Jarasandha's eighteen attacks) and 5.23 (Kalayavana and Dwaraka). The 'position' in narrative_order is book x 1000 + chapter."
