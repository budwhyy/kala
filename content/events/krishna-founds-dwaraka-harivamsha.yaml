summary_beginner: "In the Harivamsha, Krishna tells the Yadavas that Mathura is too small and too easily entered by their enemies. As Jarasandha and Kalayavana advance, the Yadavas leave Mathura and march west to the sea. Krishna asks the ocean to withdraw and give them room; the divine architect Vishvakarma lays out the city of Dwaraka there."
summary_scholar: "Dutt, Harivamsha Parva ch. 113 (the decision and the march) and ch. 115 (the laying out of Dwaraka, with the ocean's gift of land). The 'position' in narrative_order is the chapter number of Dutt's Harivamsha Parva."
