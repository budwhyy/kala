summary_beginner: "On the eve of Rama's consecration as heir, Queen Kaikeyi, urged on by her maid, reminds Dasharatha of two boons he granted her when she saved his life in a war of gods and demons. She now claims them: that her son Bharata be consecrated, and that Rama be sent to the Dandaka forest for fourteen years. The king, bound by his word, is broken by grief."
summary_scholar: "Griffith 2.9 (the maid recalls the boons and the battle against Shambara in the south) and 2.11 (Kaikeyi's demand: 'nine years and five', i.e. fourteen)."
