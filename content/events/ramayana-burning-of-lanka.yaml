summary_beginner: "Hanuman lays waste Ravana's grove and kills many of his warriors before letting himself be captured by Indrajit. Vibhishana persuades Ravana not to kill an envoy, so Ravana has Hanuman's tail set on fire. Hanuman leaps from roof to roof and sets Lanka ablaze, then returns to Rama with news of Sita."
