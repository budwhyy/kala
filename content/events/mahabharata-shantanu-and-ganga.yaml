summary_beginner: "In the Mahabharata, the goddess Ganga, in human form, marries King Shantanu on condition that he never questions what she does. She drowns their first seven children at birth. When Shantanu protests at the eighth, she tells him who she is: the children are the eight Vasus, cursed to be born among men, and she has freed them. She spares the eighth child and leaves the king."
summary_scholar: "Ganguli 1.97 tells how Ganga first approached Pratipa, who, because she sat on his right thigh (the seat of a daughter or daughter-in-law), accepted her for his son. 1.98 gives the marriage, the drowned children and Ganga's explanation of the Vasus' curse (by Vasishtha, there called Apava). The eighth child is named Gangadatta here; he is later Devavrata, called Bhishma. The 'position' in narrative_order is parva x 1000 + Ganguli's section number of the main passage, so events sort in the order the epic tells them."
