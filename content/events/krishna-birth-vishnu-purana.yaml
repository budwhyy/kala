summary_beginner: "In the Vishnu Purana, the guards and gate-keepers of Mathura are put to sleep on the night Krishna is born. Vasudeva carries the child out through the rain, sheltered by the many-headed serpent Shesha, and the Yamuna sinks to his knees as he crosses. On the far bank he leaves Krishna beside the sleeping Yashoda and takes her new-born daughter back to Devaki. When Kamsa tries to kill the girl she becomes a goddess. Nanda takes Krishna and Balarama home to Gokula."
summary_scholar: "Wilson VP 5.3 (the birth, crossing and exchange) and 5.5 (Nanda's return to Gokula and Putana). Compare the Harivamsha (chs. 59-60), which has Krishna himself ask to be taken to Nanda's house and moves Balarama's embryo to Rohini; Wilson's notes compare the Puranic versions. The 'position' in narrative_order is book x 1000 + chapter."
