summary_beginner: "As the armies face each other at Kurukshetra, Arjuna sees teachers, grandfathers and kinsmen on both sides and refuses to fight. His charioteer Krishna teaches him: the self is never born and never dies; one should do one's duty without attachment to its fruits; and devotion to Krishna is the highest way. Krishna shows Arjuna his universal form. At the end Arjuna takes up his bow again."
summary_scholar: "Bhishma Parva, Ganguli 6.25-6.42, which Sanjaya narrates to Dhritarashtra (the chapter headings I-XVIII in the sacred-texts edition are an editor's aid, not Ganguli's). KĀLA's concept records (linked from this event) explain how different schools read the Gita's teaching. The text record bhagavad-gita treats the Gita as a work in its own right. The 'position' in narrative_order is parva x 1000 + Ganguli's section number of the main passage, so events sort in the order the epic tells them."
