summary_beginner: In the Nidanakatha, Queen Maha Maya sets out from Kapilavastu for her family's
  town of Devadaha. In the Lumbini grove between the towns she takes hold of a sal branch and gives
  birth standing. The child takes seven strides and declares himself chief of the world, and is
  carried back to Kapilavastu. His mother dies seven days later.
