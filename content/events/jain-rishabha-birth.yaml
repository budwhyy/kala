summary_beginner: "Rishabha descends from the Sarvarthasiddha heaven into the womb of Marudevi, wife of the patriarch Nabhi, in Bharatavarsha in the land of Ikshvaku. Marudevi first dreams of a bull, and Nabhi himself interprets her dreams. She gives birth to a healthy boy."
