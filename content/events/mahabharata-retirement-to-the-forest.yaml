summary_beginner: "Years after the war, the old king Dhritarashtra leaves Hastinapura for the forest with Gandhari; Kunti goes with them and will not be turned back. They settle on the Ganga and later near Kurukshetra. Vidura dies in the forest, and Vyasa lets the bereaved see their dead for one night. Two years later, Narada tells Yudhishthira that a forest fire has consumed Dhritarashtra, Gandhari and Kunti, who chose not to flee; Sanjaya escaped."
summary_scholar: "Ashramavasika Parva, Ganguli 15.15-15.19 (the departure and the stay on the Bhagirathi and at Kurukshetra), 15.26 (Vidura), 15.33 (the night of the dead) and 15.37 (the fire). The 'position' in narrative_order is parva x 1000 + Ganguli's section number of the main passage, so events sort in the order the epic tells them."
