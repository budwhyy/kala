summary_beginner: "In the Kalpa Sutra, Mahavira descends from the heavenly palace Pushpottara into the womb of the Brahmin woman Devananda. The god Shakra, holding that a Tirthankara should be born into a Kshatriya family, has the embryo moved to the womb of Trishala, wife of Siddhartha, in the Kshatriya part of Kundagrama. Trishala then sees fourteen auspicious dreams."
summary_scholar: "Jacobi notes that the Digambaras reject this story as absurd while the Svetambaras uphold it; he offers his own conjecture about its origin, which is not stored here."
