summary_beginner: In Asvaghosha's poem the queen goes with the king's leave to the Lumbini garden,
  and as she holds a flowering bough the child comes forth from her side, without pain. Indra
  receives him. His father names him Sarvarthasiddha; his mother, unable to bear the joy, goes to
  heaven.
