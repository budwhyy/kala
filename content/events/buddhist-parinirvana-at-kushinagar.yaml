summary_beginner: In the Mahaparinibbana Sutta the Buddha goes with Ananda to the sal grove of the
  Mallas at Kusinara and lies down between twin sal trees. His last exhortation is that all composite
  things decay and that his followers should strive on with diligence. He passes through the stages
  of meditation and dies, and the earth quakes.
