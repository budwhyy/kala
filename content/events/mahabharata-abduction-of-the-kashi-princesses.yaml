summary_beginner: "To find wives for the young king Vichitravirya, Bhishma goes to Varanasi, where the three daughters of the king of Kashi are to choose husbands. He carries them off in his chariot and defeats the kings who pursue him. The eldest, Amba, tells him she had already chosen the lord of Saubha (Salva), so he lets her go; the other two, Ambika and Ambalika, marry Vichitravirya."
summary_scholar: "Adi Parva 1.102 gives the abduction and Amba's release. Bhishma retells it in the Udyoga Parva (5.175-176), adding that Salva refused to take Amba back because Bhishma had won her; that sequel is recorded separately as Amba's vow. The 'position' in narrative_order is parva x 1000 + Ganguli's section number of the main passage, so events sort in the order the epic tells them."
