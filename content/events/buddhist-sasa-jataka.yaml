summary_beginner:
  A hare, wise among his friends the otter, jackal and monkey, resolves on a fast-day
  that, having only grass, he will give his own body to any beggar. Sakka comes disguised as a brahmin
  to test him; the others offer food they have found, but the hare leaps into the fire Sakka makes,
  which does not burn him. Sakka paints the sign of the hare on the moon so that his virtue is known.
  The Buddha tells it at Jetavana in praise of a lay follower's generous gifts.
