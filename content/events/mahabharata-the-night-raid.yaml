summary_beginner: "After Duryodhana's fall, Drona's son Ashvatthama, with Kripa and Kritavarma, attacks the victors' camp at night. After worshipping Shiva, he enters the camp, kills Dhrishtadyumna in his sleep, then Shikhandi, the sons of Draupadi and the remaining Panchalas, while the other two guard the gate. The three bring the news to the dying Duryodhana. Pursued by the Pandavas, Ashvatthama looses a terrible weapon, gives up the gem on his head and is cursed by Krishna to wander."
summary_scholar: "Sauptika Parva, Ganguli 10.7 (the worship of Shiva), 10.8 (the slaughter), 10.9 (Duryodhana's death) and 10.16 (the curse and the gem). The raid is not counted among the eighteen days of battle. The 'position' in narrative_order is parva x 1000 + Ganguli's section number of the main passage, so events sort in the order the epic tells them."
