summary_beginner: "Jealous of the Pandavas' wealth, Duryodhana has them invited to a game of dice at Hastinapura, with Shakuni throwing for him. Yudhishthira loses his wealth, his brothers, himself and finally Draupadi. Duhshasana drags her into the hall by her hair and tries to pull off her garment, but as she calls on Krishna, new garments keep appearing. Bhima vows to drink Duhshasana's blood. After a second game, the Pandavas must live twelve years in the forest and a thirteenth year unrecognised."
summary_scholar: "Dyuta Parva, Ganguli 2.57 (Vidura's invitation; the Pandavas go to Hastinapura), 2.58-2.64 (the game and the staking of Draupadi), 2.66 (her question, Vikarna's support, the endless garments and Bhima's vow) and 2.75 (the second game and its terms). Ganguli's text says that Dharma, unseen, covered her; other recensions differ in this scene, which is not compared here. The 'position' in narrative_order is parva x 1000 + Ganguli's section number of the main passage, so events sort in the order the epic tells them."
