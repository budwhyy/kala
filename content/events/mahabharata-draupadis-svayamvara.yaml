summary_beginner: "Hearing of the self-choice ceremony of Drupada's daughter, the Pandavas go from Ekachakra to Panchala, still disguised as Brahmanas. The kings fail to string the great bow; Arjuna strings it and shoots the target through the device above it with five arrows. The kings attack and are held off by Arjuna and Bhima, while Krishna recognises them. At home, Kunti, not looking up, tells her sons to share what they have brought. Vyasa explains why Draupadi may marry all five brothers, and the weddings follow, Yudhishthira first."
summary_scholar: "Swayamvara and Vaivahika Parvas, Ganguli 1.186-1.200: the journey from Ekachakra (1.186), the contest (1.189-1.190), the fight (1.192), Krishna recognising the brothers (1.191), Kunti's words (1.193) and the wedding (1.200). The text locates the ceremony at Drupada's city in Panchala; Kampilya is named as his capital in 1.140. The 'position' in narrative_order is parva x 1000 + Ganguli's section number of the main passage, so events sort in the order the epic tells them."
