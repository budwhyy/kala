summary_beginner: "Sugriva challenges his brother Vali at Kishkindha. Vali's wife Tara warns him, but he goes out to fight, and as the brothers struggle Rama's arrow strikes Vali down. Sugriva is crowned king of the vanaras, with Vali's son Angada as his heir."
