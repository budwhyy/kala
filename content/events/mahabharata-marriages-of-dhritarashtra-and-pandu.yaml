summary_beginner: "Bhishma seeks a bride for Dhritarashtra: Gandhari of Gandhara, who has a boon from Shiva of a hundred sons. Her father Subala hesitates because the groom is blind, but agrees; Gandhari then blindfolds her own eyes, and her brother Shakuni brings her to the Kurus. Pandu is chosen by Kunti at a self-choice ceremony, and Bhishma obtains a second bride for him, Madri, from her brother Shalya, king of Madra, in exchange for great gifts, as Madra custom required."
summary_scholar: "Ganguli 1.110 (Gandhari), 1.112 (Kunti's svayamvara) and 1.113 (Madri). These marriages join the Kurus to Gandhara, to the Yadava house of Shura through Kunti (see 1.111) and to Madra; the kingdom records note the alliances. The 'position' in narrative_order is parva x 1000 + Ganguli's section number of the main passage, so events sort in the order the epic tells them."
