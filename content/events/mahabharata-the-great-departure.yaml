summary_beginner: "Hearing of the Yadavas' end, the Pandavas crown Parikshit and set out, dressed in bark, with Draupadi and a dog following. They go east to the sea of red waters, where Arjuna gives up his bow; south and west, where they see Dwaraka under the ocean; then north past Himavat and a desert of sand to Mount Meru. One by one Draupadi, Sahadeva, Nakula, Arjuna and Bhima fall. Indra comes for Yudhishthira, who will not enter heaven without the faithful dog; the dog is Dharma."
summary_scholar: "Mahaprasthanika Parva, Ganguli 17.1 (the journey round the earth), 17.2 (the falls, with Yudhishthira's reasons) and 17.3 (Indra and the dog). The route record pandavas-final-journey maps only the places the text names; Meru is a cosmological mountain and has no coordinates. The 'position' in narrative_order is parva x 1000 + Ganguli's section number of the main passage, so events sort in the order the epic tells them."
