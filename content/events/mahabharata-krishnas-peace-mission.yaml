summary_beginner: "Krishna goes from Upaplavya to Hastinapura as the Pandavas' envoy, to seek their share of the kingdom without war. He pleads before the Kuru assembly, but Duryodhana refuses and, with Karna, Shakuni and Duhshasana, plots to seize him. Krishna laughs, and gods and heroes blaze out of his body in a vision of his divine form. He returns to Upaplavya and reports that war cannot be avoided."
summary_scholar: "Bhagavad-yana Parva, Ganguli 5.72 (Yudhishthira's charge), 5.95 (Krishna's plea before the assembly), 5.130 (the plot), 5.131 (the vision) and 5.147 (the return to Upaplavya). The 'position' in narrative_order is parva x 1000 + Ganguli's section number of the main passage, so events sort in the order the epic tells them."
