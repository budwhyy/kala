summary_beginner: "Back at Dvaitavana, the brothers chase a deer that has carried off a Brahmana's fire-sticks. Thirsty, they find a lake guarded by an invisible voice; one after another the four younger brothers drink without answering its questions and fall dead. Yudhishthira answers every riddle. Offered one brother's life, he chooses Nakula, son of Madri. The yaksha reveals himself as Dharma, Yudhishthira's father, restores all four, and directs them to pass the thirteenth year in disguise."
summary_scholar: "Aranya Parva, Ganguli 3.309 (the deer and the fire-sticks), 3.310 (the lake), 3.311 (the questions) and 3.312 (Dharma revealed); 3.313 opens with the Pandavas preparing, at Dharma's command, for the year of concealment. The 'position' in narrative_order is parva x 1000 + Ganguli's section number of the main passage, so events sort in the order the epic tells them."
