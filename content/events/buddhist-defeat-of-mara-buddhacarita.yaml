summary_beginner: In Asvaghosha's poem Mara, whom the poet identifies with Kamadeva, fears the sage
  seated in resolve beneath the tree and gathers his sons, daughters and host against him; unable to
  shake him, Mara and his army flee. The old poem ends here; the awakening that follows in Cowell's
  Book XIV belongs to the later supplement.
