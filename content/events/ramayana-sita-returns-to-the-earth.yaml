summary_beginner: "In the Uttara Kanda, Lava and Kusha sing Valmiki's poem at Rama's horse sacrifice, and Rama recognises them as his sons. Valmiki brings Sita before the assembly. Asked once more to prove her purity, she calls on the goddess Earth to take her if she has never thought of anyone but Rama. A throne rises from the ground, the Earth takes Sita on it, and she disappears into the earth as flowers fall from heaven."
summary_scholar: "Dutt 7.106 (the recitation) and 7.110 (Sita's oath and descent); 7.111 begins Rama's grief. Tagged with the Uttara Kanda variant: Uttara Kanda (Book VII), which scholars generally regard as a later addition to Valmiki's poem."
