summary_beginner: "Bharata refuses the throne and comes to Chitrakuta to beg Rama to return and rule. Rama will not break his father's word. Bharata takes Rama's sandals as a pledge, and instead of living in Ayodhya rules the kingdom from Nandigrama in hermit's dress, in Rama's name, until his return."
