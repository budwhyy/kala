summary_beginner: "After his parents' death, at thirty, Mahavira gives away his wealth with his elder brother's permission. Carried in a palanquin to a park, he takes off his ornaments under an Ashoka tree, plucks out his hair in five handfuls, and leaves home for the homeless life."
