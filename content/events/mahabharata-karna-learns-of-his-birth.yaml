summary_beginner: "Leaving Hastinapura, Krishna takes Karna in his chariot and tells him that he is the son of Kunti, born before Yudhishthira, and so by right the eldest of the Pandavas; he offers him the kingship. Karna refuses to abandon Duryodhana. Kunti then goes to him herself, and a voice from the Sun confirms her words. Karna still will not change sides, but promises her that he will spare four of her sons and fight only Arjuna."
summary_scholar: "Udyoga Parva, Ganguli 5.140-5.143 (Krishna and Karna) and 5.144-5.146 (Kunti and Karna). The 'position' in narrative_order is parva x 1000 + Ganguli's section number of the main passage, so events sort in the order the epic tells them."
