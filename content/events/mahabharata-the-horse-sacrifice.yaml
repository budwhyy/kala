summary_beginner: "Abhimanyu's son Parikshit is born dead, struck by Ashvatthama's weapon, and Krishna restores him to life. Yudhishthira then performs the horse sacrifice: the horse is set free to wander, followed by Arjuna. In Manipura Arjuna's own son Babhruvahana, urged on by Ulupi, fights him and lays him low; Ulupi brings a gem that restores the dead and revives him. The horse returns and the sacrifice is completed."
summary_scholar: "Ashvamedhika Parva, Ganguli 14.69-14.70 (Parikshit), 14.73 (the horse released), 14.79-14.80 (Babhruvahana and Ulupi) and 14.89 (the sacrifice). The 'position' in narrative_order is parva x 1000 + Ganguli's section number of the main passage, so events sort in the order the epic tells them."
