summary_beginner: In the Mahabharata the gods and asuras often fought for lordship of the three worlds. The gods took Brihaspati as their priest, the asuras took Shukra, who could bring their slain back to life. Brihaspati could not do the same, so the gods sent his son Kacha to learn Shukra's secret. One battle, after the churning of the ocean, ends with the gods winning and the Danavas fleeing underground.
summary_scholar: MBh 1.76 introduces the rivalry in the setting of Kacha's pupilage, and 1.19 gives the battle that follows the churning, with Nara and Narayana. These are different strands of the Adi Parva and are combined here only as the epic's picture of recurring war between gods and asuras. No date or cosmic position is given. The 'position' in narrative_order is the Adi Parva section number of the main passage.
