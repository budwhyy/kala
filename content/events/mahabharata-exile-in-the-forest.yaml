summary_beginner: "The Pandavas leave Hastinapura dressed in deerskins, with Draupadi and a crowd of Brahmanas. They spend the first night at a great banyan on the Ganga, cross the field of Kurukshetra, and settle in the Kamyaka forest on the Sarasvati, at the edge of a level, wild plain. Later they move to the lake of Dvaitavana, also on the Sarasvati, and after Vyasa's visit return to Kamyaka. The two forests are their main homes during the twelve years."
summary_scholar: "Sabha Parva 2.76 (departure) and Vana Parva 3.1 (the banyan Pramana on the Ganga), 3.5 (Kurukshetra and Kamyaka), 3.24-3.25 (Dvaitavana by the Sarasvati) and 3.36 (back to Kamyaka). The forest years also include Arjuna's journey for weapons and a long pilgrimage to the tirthas, recorded only in part here. The 'position' in narrative_order is parva x 1000 + Ganguli's section number of the main passage, so events sort in the order the epic tells them."
