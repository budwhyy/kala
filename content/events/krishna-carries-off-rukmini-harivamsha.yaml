summary_beginner: "In the Harivamsha, Jarasandha arranges for Rukmini, daughter of King Bhishmaka of Kundina, to marry Shishupala. On the day before the wedding Rukmini goes out to worship at the temple of Indrani; as she comes out, Krishna overpowers her guards and takes her into his chariot, while Balarama holds off the kings."
summary_scholar: "Dutt, Harivamsha Parva ch. 116 (printed CXVVI) and ch. 117 (Rukmi's pursuit and defeat). An earlier gathering at Kundina is told in chs. 103-108. The 'position' in narrative_order is the chapter number of Dutt's Harivamsha Parva."
