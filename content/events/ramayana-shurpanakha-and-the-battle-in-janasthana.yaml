summary_beginner: "Ravana's sister Shurpanakha sees Rama at Panchavati, desires him and, when mocked and refused, rushes at Sita. At Rama's word Lakshmana cuts off her nose and ears. She runs to her brother Khara, whose army of rakshasas, with Dushana and Trishiras, is destroyed by Rama alone."
