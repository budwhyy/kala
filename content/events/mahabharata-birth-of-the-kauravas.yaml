summary_beginner: "Gandhari's pregnancy lasts two years. In despair she strikes her womb and brings forth a hard ball of flesh. Vyasa has it sprinkled with water; it divides into a hundred and one parts, which are kept in pots of clarified butter. From them are born Duryodhana and his ninety-nine brothers, and one daughter, Duhshala. Dhritarashtra also has a son, Yuyutsu, by a Vaishya woman."
summary_scholar: "Ganguli 1.115 (the birth), 1.116 (how the hundred-and-first part became the daughter Duhshala) and 1.117 (the list of names, and Duhshala's marriage to Jayadratha of Sindhu). The 'position' in narrative_order is parva x 1000 + Ganguli's section number of the main passage, so events sort in the order the epic tells them."
