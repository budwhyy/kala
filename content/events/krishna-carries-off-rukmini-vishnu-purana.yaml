summary_beginner: "In the Vishnu Purana, Bhishmaka of Vidarbha, who lives at Kundina, promises his daughter Rukmini to Shishupala at Jarasandha's suggestion. Krishna goes to Kundina for the wedding and carries her off on its eve. Balarama and the Yadavas repel the angry kings; her brother Rukmin pursues Krishna, is defeated and is spared at Rukmini's plea. Pradyumna is born to Rukmini."
summary_scholar: "Wilson VP 5.26. Wilson's note identifies Kundina with Kundapur near Amaravati (see the place record). The 'position' in narrative_order is book x 1000 + chapter."
