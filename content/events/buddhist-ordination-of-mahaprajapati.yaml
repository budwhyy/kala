summary_beginner: In the Cullavagga, Mahaprajapati asks the Buddha at Kapilavastu to let women enter
  the homeless life and is refused three times. She cuts her hair, puts on yellow robes and follows
  him with Sakya women to Vesali. Ananda pleads for her, recalling that she nursed the Buddha after his
  mother's death; the Buddha agrees that her acceptance of eight chief rules shall count as her
  ordination.
