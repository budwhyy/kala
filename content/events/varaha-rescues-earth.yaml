summary_beginner: >-
  At the start of the present kalpa the Earth lies beneath the cosmic ocean. In the Vishnu Purana, Narayana takes the form
  of a boar, descends into the waters, and lifts the Earth up on his tusks after she praises him, so that creation can
  begin again.
summary_scholar: >-
  The Vishnu Purana tells it in one chapter and mentions that in earlier kalpas Narayana had already taken the forms of a
  fish and a tortoise. The Harivamsha lists the boar among Vishnu's incarnations and describes the boar's body in terms of
  the sacrifice (the Vedas are his feet, the altar his tusk). In the Santi Parva Narayana says he will be the boar in a
  future kalpa and, in that form, also slay the Daitya Hiranyaksha. The Hiranyaksha story appears in other Puranas,
  according to Wilson's note, and is not told in the sources KALA holds for this event.
