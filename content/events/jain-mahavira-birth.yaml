summary_beginner: "After nine months and seven and a half days Trishala gives birth to Mahavira at midnight. Gods descend in a great light, the kingdom celebrates for ten days, and because the family's wealth had grown since his conception his parents name him Vardhamana, 'the increasing'."
summary_scholar: "The birthplace is the Kshatriya part of Kundagrama (section 21); no place record exists for it."
