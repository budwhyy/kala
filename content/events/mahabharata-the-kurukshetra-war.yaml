summary_beginner: "Eighteen armies meet at Kurukshetra and fight for eighteen days. The Kaurava commanders fall one after another: Bhishma is laid on a bed of arrows by Arjuna, and later Karna is killed by Arjuna. On the last day Bhima breaks Duryodhana's thighs with his mace, fulfilling his vow. KĀLA tells the battle day by day in its battlefield record, kurukshetra-war; this event is only a summary."
summary_scholar: "The Parva-sangraha (Ganguli 1.2) gives the eighteen akshauhinis and eighteen days. Bhishma's fall: 6.120; Karna's death: 8.91; Duryodhana's fall: 9.58. Commanders, formations, encounters and the fallen are recorded in the battlefield record kurukshetra-war (Bhishma, Drona, Karna and Shalya Parvas). The war is a literary account, not verified history. The 'position' in narrative_order is parva x 1000 + Ganguli's section number of the main passage, so events sort in the order the epic tells them."
