summary_beginner: "In the Vishnu Purana, Samba and other youths mock the sages and Samba is cursed to bear an iron pestle, which is broken and thrown into the sea. Seeing evil omens at Dwaraka, Krishna takes the Yadavas to Prabhasa, where they quarrel and all perish. The great serpent Shesha issues from Balarama's mouth. A hunter named Jara, whose arrow is tipped with iron from the pestle, shoots Krishna, who becomes one again with the universal spirit."
summary_scholar: "Wilson VP 5.37; 5.38 continues with Arjuna's arrival at Dwaraka and the beginning of the Kali age. Compare the Mahabharata's Mausala Parva (16.1-16.7), recorded as a separate event. The 'position' in narrative_order is book x 1000 + chapter."
