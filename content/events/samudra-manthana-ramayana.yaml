summary_beginner: In the Ramayana, the sage Vishvamitra tells Rama that the sons of Diti and the sons of Aditi, all sons of Kashyapa, agreed to churn the milky sea for deathlessness. A deadly poison rose and Shiva drank it; Vishnu became a tortoise to stop the mountain sinking. Dhanvantari, the Apsarases, Sura, the steed Uchchaihshravas, the Kaustubha gem, the Moon and Lakshmi rose in turn, followed by the amrita, over which the two families fought and Indra won back his kingdom.
summary_scholar: "Griffith's Book 1 canto 45 (The Quest of the Amrit), told as Vishvamitra's story of the town of Vishala. The canto gives its own etymology: those who loved Sura are the Suras and those who refused her are the Asuras. It places the story before the end of the Krita age but does not say when in a cycle, and no cosmic position is recorded, since no cycle model in the data covers the Ramayana. The Ramayana names neither Airavata nor a female form of Vishnu. The 'position' in narrative_order is the canto number in Book 1."
