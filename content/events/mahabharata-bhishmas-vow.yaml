summary_beginner: "Shantanu meets Satyavati on the banks of the Yamuna, but her father will give her only if her son becomes king. To end his father's grief, Prince Devavrata gives up his right to the throne before the assembled kings and then vows never to marry. The gods call him Bhishma, 'the terrible', and Shantanu grants him the boon of dying only when he chooses."
summary_scholar: "Ganguli 1.100. The vow is the hinge of the Kuru succession: it leaves the throne to Satyavati's sons and, when they die without heirs, leads to the niyoga by which Vyasa fathers Dhritarashtra, Pandu and Vidura. The 'position' in narrative_order is parva x 1000 + Ganguli's section number of the main passage, so events sort in the order the epic tells them."
