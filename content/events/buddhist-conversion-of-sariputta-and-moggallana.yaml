summary_beginner: In the Nidanakatha two ascetics living near Rajagaha, Sariputta and Moggallana,
  are converted by a single verse spoken by the elder Assaji, leave their teacher Sanjaya and join
  the order at the Bamboo Grove. Both soon reach arahatship and the Buddha names them his chief
  disciples.
