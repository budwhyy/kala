summary_beginner: In the Nidanakatha the gods show the prince, on his way to his pleasure garden, a
  man worn by age, then a sick man, then a dead man, and each time he turns back troubled while the
  king widens his guards. Last he sees a mendicant who has left the world, and his thoughts turn to
  doing the same. The text notes that the reciters of the Digha Nikaya say he saw all four on one
  day.
