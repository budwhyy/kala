summary_beginner: "When Sita is brought to him, Rama tells her before the army that he fought to clear his honour, and that after her long stay in Ravana's house he cannot take her back. Sita asks Lakshmana to build a pyre, prays to Fire as the witness of her faithfulness and enters the flames. The god of fire brings her out unharmed and declares her pure; Rama says he never doubted her but needed the world to see the proof."
summary_scholar: "Griffith 6.117-6.120. In Tulsidas's Ramcharitmanas only Sita's image is consumed in this fire (see the linked event)."
