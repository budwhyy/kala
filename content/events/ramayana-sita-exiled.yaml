summary_beginner: "In the Uttara Kanda, Rama learns that the people of Ayodhya gossip about Sita's long captivity in Lanka. Though sure of her purity, he orders Lakshmana to take the pregnant Sita, who has asked to visit the hermitages by the Ganga, and leave her there. Lakshmana tells her the truth across the river, and the sage Valmiki gives her shelter."
summary_scholar: "Dutt 7.52-7.59 (Dutt's numbering). Tagged with the Uttara Kanda variant: Uttara Kanda (Book VII), which scholars generally regard as a later addition to Valmiki's poem. Tulsidas's Ramcharitmanas has no exile of Sita."
