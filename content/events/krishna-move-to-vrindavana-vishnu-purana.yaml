summary_beginner: "In the Vishnu Purana, the infant Krishna kicks over a cart and, tied to a mortar, drags it between two trees and pulls them down. Taking these and the death of Putana as evil omens, the cowherds leave Vraja for Vrindavana, where there is fresh grass for the cattle even in the hot season."
summary_scholar: "Wilson VP 5.6, with Wilson's note contrasting the Harivamsha, where Krishna produces wolves to force the move. The 'position' in narrative_order is book x 1000 + chapter."
