summary_beginner: In the Nidanakatha, after Sujata's offering of milk-rice at Uruvela, the
  Bodhisatta takes his seat under the Bo-tree. Mara's army attacks and Mara claims the seat; the
  Bodhisatta calls the earth to witness his past giving, and the army flees. In the three watches
  of the night he gains knowledge of past lives, of the present, and of the chain of causation, and
  at dawn attains complete enlightenment.
