summary_beginner: In the Nidanakatha, when the Buddha visits Kapilavastu, the mother of Rahula sends
  the boy to ask his father for his inheritance. The Buddha has Sariputta receive him into the order,
  giving him the wealth of the arahats instead. The grieving king asks, and is granted, that no son be
  ordained without his parents' leave.
