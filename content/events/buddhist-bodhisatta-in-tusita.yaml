summary_beginner: In the Nidanakatha, after his birth as Vessantara the future Buddha is reborn in
  the Tusita heaven. When the gods proclaim that a Buddha will soon arise, the deities of the ten
  thousand world-systems gather and beg him to become the Buddha now.
