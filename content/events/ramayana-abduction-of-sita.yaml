summary_beginner: "With both brothers gone, Ravana comes to the hermitage as a wandering ascetic, reveals himself, seizes Sita and carries her off through the sky in his chariot. The old vulture Jatayu attacks him, but Ravana cuts off his wings and leaves him dying. Sita is taken to Lanka."
summary_scholar: "Griffith 3.46-3.54. In Tulsidas's Ramcharitmanas the episode is told differently: Rama has the real Sita enter fire beforehand, and it is her image that is carried off (see the linked event)."
