summary_beginner: The kingdom of the vanaras (monkey people) in the Ramayana, ruled from the cave-city of Kishkindha by Vali and then by his brother Sugriva, Rama's ally.
summary_scholar: An epic kingdom with no historical counterpart in our data. Its rulers are figures of the epic, not attested kings. The location of its capital is debated (see the Kishkindha place record).
