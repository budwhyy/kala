summary_beginner: Ravana's kingdom of the rakshasas in the Ramayana, ruled from the city of Lanka across the sea. After Ravana's death his brother Vibhishana becomes king.
summary_scholar: An epic kingdom, kept separate from the modern island and state of Sri Lanka. Its rulers are figures of the epic, not attested kings. The Uttara Kanda's account of earlier rulers of Lanka (including Kubera) is not entered here.
