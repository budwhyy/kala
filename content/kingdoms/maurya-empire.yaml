summary_beginner: "The first empire to unite most of the subcontinent, founded by Chandragupta and ruled from Pataliputra; under Ashoka its reach is shown by edicts from the north-west to Karnataka."
summary_scholar: "Its reach is drawn only from the findspots of Ashoka's inscriptions and a few other records, never as a border. The Puranic list of Maurya kings is a separate record (puranic-maurya-kingdom)."
references:
  - source: "hultzsch-inscriptions-asoka"
    locator: "xxx"
  - source: "smith-early-history-1914"
    locator: "193"
