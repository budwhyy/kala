summary_beginner: "The realm of the Yadava clans (Vrishnis, Andhakas, Bhojas) in the Mahabharata and the Puranas, ruled from Mathura and later from Dwaraka, and the home of Krishna."
summary_scholar: "The texts speak of several Yadava clans (Vrishnis, Andhakas, Bhojas, Kukuras) acting together; this record groups their polity as the texts describe it. The legendary dynasty is recorded separately (yadava-dynasty)."
