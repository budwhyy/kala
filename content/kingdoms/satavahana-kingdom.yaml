summary_beginner: "A long-lived dynasty of the Deccan, called Andhra in the Puranas, which ruled from Pratishthana (Paithan) on the Godavari."
summary_scholar: "The Puranas place the whole dynasty after the Kanvas; Smith argues from the Nanaghat and Hathigumpha inscriptions that it began much earlier. The Puranic Andhra list is a separate record."
