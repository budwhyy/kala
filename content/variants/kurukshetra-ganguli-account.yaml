description:
  The Mahabharata's own telling of the eighteen-day war at Kurukshetra, from the mustering of the
  armies in the Udyoga Parva to Duryodhana's fall in the Shalya Parva, cited by the section numbers
  of Ganguli's translation (Bhishma, Drona, Karna and Shalya Parvas). Other versions and modern
  retellings may order the days or name the arrays differently.
