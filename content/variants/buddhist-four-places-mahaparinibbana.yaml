slug: buddhist-four-places-mahaparinibbana
names:
  - text: The four places of pilgrimage (Mahaparinibbana Sutta)
    lang: en
    script: Latn
kind: list
tradition: buddhist
text: mahaparinibbana-sutta
description: In the Mahaparinibbana Sutta (Rhys Davids' translation) the Buddha tells Ananda of four
  places a faithful person may visit with reverence, naming them by the event each marks - his
  birth, his full enlightenment, the first turning of the wheel of the Dhamma, and his final
  passing away. In the translation read the events are given without place names; the places are
  matched to the events by the sources cited on each place record.
references:
  - source: rhys-davids-buddhist-suttas
    locator: "5.16-20"
  - source: rhys-davids-buddhist-suttas
    locator: "5.21-22"
    note: Pilgrims of all four groups will come to these places, and those who die on such a
      pilgrimage are said to be reborn in a good state.
