tradition: shakta
text: devi-bhagavata-purana
description: "The list of one hundred and eight seats (pithas) of the Devi, each with the name she bears there, given by Vyasa to Janamejaya in the Devi Bhagavata Purana (book 7, chapter 30, verses 53-102 in Vijnanananda's numbering) after the account of Sati's death. It names the face of Gauri falling at Kashi as Visalakshi, and goes on through places such as Prayaga, Gaya, Pushkara and Dvaravati. This is one text's list and is not the same as the lists of fifty-one pithas found in other traditions, which KALA does not hold from any public-domain English source."
references:
  - source: vijnanananda-devi-bhagavata
    locator: "7.30"
    note: "Verses 53-102 give the 108 seats and the Devi's name at each"
