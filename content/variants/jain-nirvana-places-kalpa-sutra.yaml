tradition: jain
text: kalpa-sutra
description: In the Kalpa Sutra (Jacobi's translation) the lives of the Jinas name the place of
  liberation (nirvana) of Mahavira at the town of Papa, of Parshva on Mount Sammeta, of Arishtanemi
  (Neminatha) on Mount Girnar, and of Rishabha on Mount Ashtapada. Only these four of its Jinas are
  placed in the passages read; other lists of Tirthankara nirvana places exist and are not entered
  here.
