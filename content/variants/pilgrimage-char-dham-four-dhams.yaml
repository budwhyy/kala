    note: "Badrinath: shrine of Vishnu in Garhwal"
  - source: imperial-gazetteer-1909
    locator: "11:387"
    note: "Dwarka: temple of Dwarkanath, one of the most holy places"
  - source: imperial-gazetteer-1909
    locator: "20:408-412"
    note: "Puri: temple of Jagannath"
  - source: imperial-gazetteer-1909
