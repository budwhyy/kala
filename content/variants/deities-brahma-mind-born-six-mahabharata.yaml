description: "The Adi Parva's list of six spiritual sons of Brahma: Marichi, Atri, Angiras, Pulastya, Pulaha and Kratu. Here Bhrigu comes out of Brahma's breast and Daksha is a son of Prachetas, so neither is in the list."
