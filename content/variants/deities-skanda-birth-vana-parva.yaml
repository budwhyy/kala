tradition: itihasa
text: mahabharata
description: "Markandeya's telling of Skanda's birth in the Vana Parva: the child is born of Agni's seed and is called Agni's son, and Brahma later tells him that Rudra had entered Agni and Uma had entered Svaha, so Mahadeva is his father."
