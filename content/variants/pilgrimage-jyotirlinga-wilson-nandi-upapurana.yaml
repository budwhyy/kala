names:
  - text: "The twelve lingas, as listed by H. H. Wilson from the Nandi Upapurana"
    lang: en
    script: Latn
kind: list
tradition: shaiva
description: "A list of twelve principal lingas of Shiva that Wilson reports, with his own comments, from the Kedara Kalpa of the Nandi Upapurana: Somanatha, Mallikarjuna (Srisaila), Mahakala (Ujjain), Omkara, Amareshvara, Vaidyanatha, Ramesha (Setubandha), Bhimashankara, Vishveshvara (an editor's insertion in the 1861 edition), Tryambaka, Gautamesa and Kedaresha. It differs from the list most often given in India today (for example it has Amareshvara and Gautamesa, where the modern list has Nageshvara and Ghrishneshvara), which is itself not recorded in a public-domain English source. Only the shrines that Wilson locates, and whose own Gazetteer article KALA has read, are entered as places; Amareshvara, Bhimashankara, Tryambaka and Gautamesa are left out because Wilson himself is unsure where they are."
references:
