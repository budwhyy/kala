description: The same prophecy as the Matsya, Vayu and Brahmanda Puranas give it, in Pargiter's 1913 collated text. These Puranas give reign lengths for each king, and they differ among themselves and from the Vishnu and Bhagavata in names, numbers of kings and totals; Pargiter records each reading in his notes.
