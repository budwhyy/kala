slug: pilgrimage-chota-char-dham-himalayan
names:
  - text: "The Himalayan Chota Char Dham: Yamunotri, Gangotri, Kedarnath, Badrinath"
    lang: en
    script: Latn
kind: list
tradition: hindu
description: "The four mountain shrines of Garhwal that pilgrims visit together as the Chota Char Dham ('small four abodes'), usually travelled from west to east: Yamunotri, Gangotri, Kedarnath and Badrinath. KALA has not found a public-domain English text that enumerates the circuit as such, so it is recorded as the present-day reckoning; each shrine is entered on the strength of its own Imperial Gazetteer article. It is a separate list from the Char Dham of the four directions."
