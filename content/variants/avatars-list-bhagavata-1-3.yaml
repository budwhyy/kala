slug: avatars-list-bhagavata-1-3
names:
  - text: "Bhagavata Purana 1.3: the twenty-two forms of the Lord"
    lang: en
    script: Latn
kind: list
tradition: vaishnava
text: bhagavata-purana
description: >-
  The list of Vishnu's descents (called "incarnations" and "emanations" in Dutt's translation) that Suta recites in the
  third chapter of the first book of the Bhagavata Purana. In Dutt's translation it runs: the four Kumaras, the boar,
  the divine sage Narada, Nara and Narayana, Kapila, Dattatreya, Yajna, Rishabha, Prithu, the fish, the tortoise,
  Dhanvantari, Mohini, the man-lion, the dwarf, Parashurama, Vyasa, the human king who tames the sea (Rama), then
  Rama (Balarama) and Krishna of the Vrishnis as the nineteenth and twentieth, the Buddha son of Anjana among the Kikatas,
  and Kalki. The text numbers the forms from the fifth to the twentieth and the others follow from the sequence.
  The list includes both Balarama and the Puranic Buddha. It also says the descents of Hari are countless, and that
  while the others are portions or emanations, Krishna is the Lord himself.
references:
  - source: dutt-bhagavata-purana
    locator: "1.3"
