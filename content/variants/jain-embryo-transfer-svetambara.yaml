description: "In the Kalpa Sutra and the Acaranga Sutra, Mahavira is first conceived by the Brahmin woman Devananda and the god Shakra has the embryo moved to the womb of the Kshatriya woman Trishala. Jacobi records that the Svetambaras uphold this account and the Digambaras reject it."
