tradition: shakta
description: "Places that the Imperial Gazetteer describes, in the words of local tradition or 'the Tantras', as pithasthanas where a part of Sati's body fell. The Gazetteer gives no list; KALA enters only Ujjain (the elbow). It stands apart from the 108 seats of the Devi Bhagavata."
