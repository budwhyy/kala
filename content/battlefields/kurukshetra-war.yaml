summary_beginner:
  This is the war at Kurukshetra as the Mahabharata tells it — the epic's own story, not an
  archaeological or historical record of a battle. In the text, eighteen armies (akshauhinis)
  meet, seven for the Pandavas and eleven for Duryodhana, and fight for eighteen days under
  Bhishma, Drona, Karna and Shalya in turn, with Krishna driving Arjuna's chariot. The days,
  battle arrays, duels and deaths shown here come from the Bhishma, Drona, Karna and Shalya
  Parvas. Ashvatthaman's night raid on the sleeping camp comes afterwards, in the Sauptika Parva,
  and is not counted as a day of battle.
summary_scholar:
  A day-by-day digest of the Kurukshetra narrative in the Mahabharata, cited to Ganguli's
  translation (Udyoga Parva for the muster, Bhishma 6.43–120, Drona 7.5–201, Karna 8.10–95, Shalya
  9.6–61). It records what the text narrates, not a reconstruction of any historical event, and
  makes no claim about where on the plain things happened. The arrays (vyuhas) are given only
  where Ganguli names them; several days have unnamed arrays, and the text is not always
  consistent (for example the Avanti princes Vinda and Anuvinda are called Kaikayas in Karna
  Parva 8.13, and Magadha and Kekaya forces appear on both sides). The night fighting after day 14
  runs into the dawn of day 15, and the Sauptika Parva's night raid falls outside the eighteen
  days.
