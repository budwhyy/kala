  - day: 15
    section: Drona Parva 7.186–7.201
    summary:
      At dawn, with the night fighting barely over, Drona kills Drupada, Virata and Drupada's three
      grandsons. On Krishna's counsel Bhima kills an elephant named Ashvatthaman and Yudhishthira
      confirms that "Ashvatthaman" is dead; Drona lays down his arms in yoga and Dhrishtadyumna
      beheads him. Ashvatthaman then looses the Narayana weapon, which subsides only when the
      Pandavas put down their arms.
