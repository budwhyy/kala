slug: vishnu-purana-cycle
names:
  - text: Vishnu Purana cycle of ages
    lang: en
    script: Latn
variant: cosmic-vishnu-purana
summary_beginner: >-
  In the Vishnu Purana, the sage Parasara explains that the sun's northern half-year is a day of
  the gods and its southern half-year their night. Twelve thousand divine years make one round of
  the four ages, Krita, Treta, Dvapara and Kali, each shorter than the last and each framed by a
  twilight before and after. A thousand such rounds make a day of Brahma, within which fourteen
  Manus reign in turn, each for seventy-one rounds and some additional years. At the end of
  Brahma's day the three worlds are consumed, and he sleeps for a night as long as his day before
  creating again.
yugas:
  - yuga: satya
    divine_years: 4800
    dawn_divine_years: 400
    dusk_divine_years: 400
    references:
      - source: wilson-vishnu-purana
        locator: "1.3"
        note: The Krita age proper is 4,000 divine years, with a twilight of as many hundreds before and after it; the total sums those stated parts, consistent with the stated 12,000 for the four ages.
  - yuga: treta
    divine_years: 3600
    dawn_divine_years: 300
    dusk_divine_years: 300
    references:
      - source: wilson-vishnu-purana
        locator: "1.3"
        note: The Treta age proper is 3,000 divine years, with twilights of 300 before and after.
  - yuga: dvapara
    divine_years: 2400
    dawn_divine_years: 200
    dusk_divine_years: 200
    references:
      - source: wilson-vishnu-purana
        locator: "1.3"
        note: The Dvapara age proper is 2,000 divine years, with twilights of 200 before and after.
  - yuga: kali
    divine_years: 1200
    dawn_divine_years: 100
    dusk_divine_years: 100
    references:
      - source: wilson-vishnu-purana
        locator: "1.3"
        note: The Kali age proper is 1,000 divine years, with twilights of 100 before and after.
mahayugas_per_manvantara: 71
manvantaras_per_kalpa: 14
mahayugas_per_kalpa: 1000
sandhi_note: >-
  The text says a manvantara lasts seventy-one rounds of the four ages "with some additional
  years" but does not say how long the addition is or call it a twilight between manvantaras.
  Seventy-one is the conservative reading; the extra period is left unquantified.
