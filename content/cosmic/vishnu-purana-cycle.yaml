pralaya:
  - kind: naimittika
    names:
      - { text: Occasional dissolution, lang: en, script: Latn }
      - { text: Naimittika, lang: sa, script: Latn, iast: naimittika }
    explanation: >-
      The dissolution tied to Brahma's sleep at the end of his day. Fire and then a great flood
      overwhelm the three worlds, and the creator rests upon the waters through a night as long as
      his day before creating anew.
    references:
      - { source: wilson-vishnu-purana, locator: "1.7" }
      - { source: wilson-vishnu-purana, locator: "6.3" }
      - { source: wilson-vishnu-purana, locator: "6.4" }
  - kind: prakritika
    names:
      - { text: Elemental dissolution, lang: en, script: Latn }
      - { text: Prakritika, lang: sa, script: Latn, iast: prākṛtika }
    explanation: >-
      The dissolution of the elements themselves. After two pararddhas, the whole span of Brahma's
      life, everything nature has produced is drawn back into the undifferentiated source it came
      from.
    references:
      - { source: wilson-vishnu-purana, locator: "1.7" }
      - { source: wilson-vishnu-purana, locator: "6.3" }
      - { source: wilson-vishnu-purana, locator: "6.4" }
  - kind: atyantika
    names:
      - { text: Absolute dissolution, lang: en, script: Latn }
      - { text: Atyantika, lang: sa, script: Latn, iast: ātyantika }
    explanation: >-
      A personal rather than cosmic ending: the wise one's final release from existence, absorbed
      through knowledge into the supreme spirit.
    references:
      - { source: wilson-vishnu-purana, locator: "1.7" }
      - { source: wilson-vishnu-purana, locator: "6.5" }
  - kind: nitya
    names:
      - { text: Perpetual dissolution, lang: en, script: Latn }
      - { text: Nitya, lang: sa, script: Latn, iast: nitya }
    explanation: >-
      The ceaseless passing away, day and night, of everything that is born. Book 1 lists it as a
      fourth kind; the Book 6 account counts only three.
    references:
      - { source: wilson-vishnu-purana, locator: "1.7" }
