summary_beginner: Settlers from the east coast of India brought Brahmanical religion and the Sanskrit language to the Khmer lands. Brahmanism was the official religion until Buddhism, present for centuries, rose to rival it from the tenth century.
summary_scholar: The 1911 Britannica states the Indian origin of Khmer Brahmanism and Sanskrit and notes that court Brahmans still performed official functions. Angkor Wat, first dedicated to Brahma and later to the Buddha, is used to place this on the map. The Khmer kingdom is not presented as the ancestor of the modern state.
