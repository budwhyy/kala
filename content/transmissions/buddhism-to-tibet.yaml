summary_beginner: According to Tibetan history, a few Buddhist objects reached Tibet earlier, probably from Nepal, but King Srong-tsan Gampo brought Buddhism and writing from India in the seventh century, helped by his Nepalese and Chinese queens.
summary_scholar: The 1911 Britannica reports this from Tibetan tradition and says the Tibetan script was made by Thonmi, sent to India to study Sanskrit and Buddhist literature. Lhasa marks the destination; the Indian point of origin is not specified in the source and is left blank.
references:
