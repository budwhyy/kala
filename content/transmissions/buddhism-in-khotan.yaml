summary_beginner: When Fa-hien passed through Khotan on his way to India, he found the whole kingdom Buddhist, with thousands of mostly Mahayana monks and great monasteries.
summary_scholar: Fa-hien attests Buddhism at Khotan but says nothing of how it arrived. Drawing the link from Gandhara, on the north-western route into India, is a map convenience and a hypothesis, not a sourced route.
