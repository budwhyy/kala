summary_beginner: The Thai Ramakien is adapted from the Indian Ramayana, and is best known as a stage drama. Some of the Indian stories in Siam arrived by way of Cambodia.
summary_scholar: The 1911 Britannica states the adaptation from the Ramayana but does not say which Indian telling lay behind the Ramakien, nor when it arrived; it adds that much of Siam's Indian-derived narrative came through Cambodia. Linking the Ramakien to Valmiki's text in particular is therefore a hypothesis, typed accordingly. Ayutthaya is used only to place the Siamese tradition on the map, not as an attested place of transmission.
