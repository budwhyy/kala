summary_beginner: The oldest language of the Avesta, the sacred book of ancient Iran, is so close to the Rigveda's that whole stanzas can be turned word for word from one into the other. Neither comes from the other; both descend from a common Indo-Iranian past.
summary_scholar: Macdonell (1900) argues from this closeness that the Indian and Iranian branches separated only a short time before the earliest Vedic hymns, and that several Vedic beliefs and rites, including the worship of soma (Avestan haoma), go back to that shared period. The arrow on the map is drawn for convenience only; the relation runs both ways from a common source.
