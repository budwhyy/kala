summary_beginner: Buddhism came to the island of Lanka from India in the third century BCE, bringing the Pali language of its scriptures. Tradition credits a mission sent under the emperor Asoka.
summary_scholar: Fa-hien, in Ceylon in the early fifth century, records that a former king obtained a slip of the sacred tree from Central India; Legge identifies it with the Bo tree still at Anuradhapura. Bodh Gaya is used as the map origin because that is where the tree tradition points; the record does not claim the tree's descent as verified.
