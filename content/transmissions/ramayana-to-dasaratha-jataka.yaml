summary_beginner: The Pali birth-stories of the Buddha include the Dasaratha Jataka, a Buddhist retelling of the Rama story. It tells only the forest exile and ends with Rama and Sita marrying, in the manner of a folk tale.
summary_scholar: Macdonell (1900) notes that because the Jataka covers only the first part of the story it might look older than Valmiki's poem. He argues instead that its author knew the expedition to Lanka as well, and that a verse of the Ramayana's sixth book appears in Pali form in the Jataka's prose. On his reading the Jataka reworks a story already known in Valmiki's form; the relative age of the two remains a scholarly argument, not a settled fact.
references:
  - source: macdonell-history-sanskrit-literature
    locator: "306-307"
note: The Jataka is a text of the Buddhist tradition in its own right; this record does not make it a branch of the Hindu epic. The Jataka story event itself is owned by the buddhist agent.
