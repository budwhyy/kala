summary_beginner: Siamese Buddhism uses Pali scriptures written in a script descended from Cambodian, and shows influences from Sri Lanka and Burma. In 1752 an embassy from Ceylon came to renew old religious ties.
summary_scholar: The 1911 Britannica describes Siamese Buddhism as tinged by Sinhalese and Burmese influence and records the 1752 embassy, but gives no account of when or how Buddhism first came to Siam. Drawing the link from Anuradhapura is therefore a hypothesis about one strand of influence, not an established route.
