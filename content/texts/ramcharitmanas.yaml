summary_beginner: >-
  The retelling of the Rama story in Awadhi (an eastern form of Hindi) by the poet Tulsidas, begun in
  1575. It is the most widely read and recited Ramayana in north India and presents Rama throughout as
  God incarnate.
summary_scholar: >-
  A devotional (bhakti) retelling, framed as a dialogue between Shiva and Parvati among other
  narrators, that follows Valmiki's outline in seven books but changes several episodes: before the
  golden deer appears Rama has Sita enter fire and leave an image of herself, which is what Ravana
  carries off and what the fire consumes at the ordeal in Lanka; and the last book has no exile of
  Sita, her sons being born in Ayodhya. Cited from F. S. Growse's English translation (1883 edition).
