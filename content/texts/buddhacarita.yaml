summary_beginner: A Sanskrit poem on the life of the Buddha attributed to the poet Asvaghosha.
summary_scholar: In Cowell's 1894 translation only Books I-XIII and the start of XIV come from the
  old poem; Books XIV-XVII were written in Nepal in 1830 by Amritananda to fill a gap, and Cowell
  prints them as a literary curiosity. KALA uses Books I-XIII only.
