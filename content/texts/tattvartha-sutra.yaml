summary_beginner: "A short Sanskrit work in ten chapters that sets out the whole of Jain teaching in aphorisms. Both Digambara and Svetambara Jains revere it; its third chapter describes the lower and middle worlds."
summary_scholar: "J. L. Jaini's 1920 translation (Sacred Books of the Jainas 2) notes that Digambaras call the author Umasvami and Svetambaras Umasvati (p. viii)."
