summary_beginner: "An Old Javanese (Kawi) epic poem on the war between the Pandawas and Korawas, drawn from the Mahabharata. Modern Javanese regard it as a poem of their own."
summary_scholar: "The 1911 Britannica (Java) lists it first among Kawi works and says its matter comes from books 5 to 10 of the Mahabharata; it gives no date. Macdonell (1900, p. 290) separately mentions an eleventh-century Javanese translation of the Mahabharata; whether that is the same work is not stated, so they are not identified here."
