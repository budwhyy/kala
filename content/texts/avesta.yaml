summary_beginner: "The sacred texts of the Zoroastrian religion of ancient Iran, in the Avestan language. Its oldest language is so close to the Rigveda's that whole stanzas can be turned from one into the other."
summary_scholar: "Macdonell (1900, p. 12) argues from this closeness that the Indian and Iranian branches parted only shortly before the earliest Vedic hymns, and (p. 68) that some Vedic beliefs, such as the sacredness of soma, go back to a shared Indo-Iranian period. No composition date is stored here."
