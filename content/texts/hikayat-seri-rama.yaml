summary_beginner: "The Malay romance of Seri Rama, founded on the adventures of heroes of the Ramayana. It exists as a written hikayat and in oral versions told by village story-tellers."
summary_scholar: "W. E. Maxwell (preface written 1886, printed 1909) published an oral version taken down from the Perak story-teller Mir Hassan and contrasts it with the better-known written hikayat of the same name. He notes that the Ramayana's action is hard to trace in the oral telling. The record here covers the Seri Rama tradition generally; the written and oral versions are not yet separated."
