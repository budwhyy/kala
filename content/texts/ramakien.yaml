summary_beginner: "The Thai telling of the Rama story, best known as a stage play. It is adapted from the Indian Ramayana tradition."
summary_scholar: "The 1911 Britannica (Siam, Language and Literature) names the Ramakien as an adaptation of the Ramayana and notes that much of Siam's Indian-derived narrative literature came by way of Cambodia; it does not say which Indian version lay behind it. No date is given here because no source read so far dates the text."
