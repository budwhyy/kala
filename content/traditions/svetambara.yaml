summary_beginner: "One of the two great divisions of the Jain community ('white-clad'). It preserves the canon translated by Jacobi, including the Acaranga and Kalpa Sutras."
references:
  - source: "jacobi-jaina-sutras-1"
    locator: "Introduction, p. xxxv"
    note: "Both Svetambaras and Digambaras hold the belief in twenty-four Tirthankaras; Jacobi thinks they separated in about the second century after Mahavira's Nirvana."
  - source: "jacobi-jaina-sutras-1"
    locator: "Introduction, p. xxxi"
    note: "Footnote 2: the Svetambaras firmly uphold the account of the transfer of Mahavira's embryo."
