    note: "Footnote 2: the Digambaras reject the account of the transfer of Mahavira's embryo."
  - source: "jaini-tattvartha-sutra-1920"
    locator: "Historical Introduction, p. viii"
    note: "The Tattvartha Sutra is revered by both Digambaras and Svetambaras."
