summary_beginner: "Krishna's life as the Harivamsha Parva tells it: birth at Mathura, childhood in Vraja and Vrindavana, the lifting of Govardhana, the killing of Kamsa at Mathura, the founding of Dwaraka and the carrying off of Rukmini from Kundina. The Harivamsha differs from the Vishnu Purana in detail (for example, why the cowherds move to Vrindavana) and adds a journey to Mount Gomanta that is not mapped here. Krishna's death is followed in the Vishnu Purana route and in the Mahabharata's Mausala Parva. This is a literary reconstruction: the route follows the order of places named in the text, not a verified itinerary, and each stop's place record carries its own confidence class."
