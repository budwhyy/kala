      - source: "ganguli-mahabharata"
        locator: "17.1"
  - order: 2
    place: "dwarka"
    note: "They go east to the sea of red waters, where Arjuna throws away his bow (not mapped), then south and south-west along the coast, and see Dwaraka covered by the ocean."
    references:
      - source: "ganguli-mahabharata"
        locator: "17.1"
  - order: 3
    place: "meru"
    note: "Turning north they see Himavat, cross it and a vast desert of sand, and see Mount Meru. On the way Draupadi, Sahadeva, Nakula, Arjuna and Bhima fall. Meru is a cosmological mountain and has no coordinates."
    references:
      - source: "ganguli-mahabharata"
        locator: "17.2"
  - order: 4
    place: "svarga"
    event: "mahabharata-ascent-to-heaven"
    note: "Indra takes Yudhishthira to heaven in his car; the dog is revealed as Dharma."
    references:
