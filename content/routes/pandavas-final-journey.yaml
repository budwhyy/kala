summary_beginner: "The Pandavas' last journey in the Mahaprasthanika Parva: from Hastinapura east to the sea, round by the coast past the drowned Dwaraka, and north across Himavat towards Mount Meru, where the brothers and Draupadi fall one by one and Yudhishthira alone is taken to heaven. Only the first two stops can be placed on a map; Meru and Svarga are cosmological. This is a literary reconstruction: the route follows the order of places named in the text, not a verified itinerary, and each stop's place record carries its own confidence class."
