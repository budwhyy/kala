summary_beginner: "From Hastinapura to Varanavata, where the house of lac is burnt; across the Ganga and through the forest to Ekachakra; on to Drupada's city in Panchala, where Arjuna wins Draupadi; and back to Hastinapura before the founding of Indraprastha (Adi Parva). Kunti travels with her sons throughout; Draupadi joins them in Panchala. This is a literary reconstruction: the route follows the order of places named in the text, not a verified itinerary, and each stop's place record carries its own confidence class."
