summary_beginner: "The twelve years of forest exile and the year in disguise (Sabha, Vana and Virata Parvas): from Hastinapura to the Ganga and across Kurukshetra to the Kamyaka and Dvaitavana forests on the Sarasvati, which they move between several times; a long pilgrimage that reaches Prabhasa on the western coast; and finally the Matsya kingdom of Virata and the town of Upaplavya. This is a literary reconstruction: the route follows the order of places named in the text, not a verified itinerary, and each stop's place record carries its own confidence class."
