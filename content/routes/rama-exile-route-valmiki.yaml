summary_beginner: >-
  The journey of Rama, Sita and Lakshmana from Ayodhya into exile, south to Lanka and back, stage by
  stage as Valmiki's Ramayana tells it (Griffith's translation). This is a literary reconstruction that
  follows the text, not a verified itinerary: several stations (the Dandaka forest, Pampa, Rishyamukha,
  Mahendra, the bridge and Lanka itself) have debated locations, and the places' own records show how
  confident each identification is. Sita travels only as far as Panchavati before she is carried off,
  and returns with Rama from Lanka.
