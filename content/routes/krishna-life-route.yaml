summary_beginner: "Krishna's life as Book 5 of the Vishnu Purana tells it: birth at Mathura, childhood among the cowherds at Gokula and Vrindavana, the lifting of Govardhana, the return to Mathura to kill Kamsa, the move to Dwaraka, the journey to Kundina for Rukmini, and his death at Prabhasa (KĀLA's place record somnath). This is a literary reconstruction: the route follows the order of places named in the text, not a verified itinerary, and each stop's place record carries its own confidence class."
