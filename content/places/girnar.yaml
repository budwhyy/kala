summary_beginner: A sacred hill in Gujarat, a major Jain pilgrimage place, where Jains hold that
  the twenty-second Tirthankara, Neminatha (Arishtanemi), attained liberation.
summary_scholar: The hill itself is well attested by inscriptions, which date from the Asokan
  period onward and do not verify the Jain account. The Gazetteer's coordinates are not used; the
  point is the present-day location of the hill. The Gazetteer says the hill is second only to
  Palitana among Jain tirthas and also lists shrines of other traditions on its peaks.
references:
