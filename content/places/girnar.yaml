evidence:
  - type: historical
    summary: The Imperial Gazetteer records a rock at the foot of the hill covered with
      inscriptions of Asoka, a later inscription of Rudradaman, and one that records repairs to the
      Sudarshana tank. These attest the hill in history; they do not concern the Jain account.
    references:
      - source: imperial-gazetteer-1909
        locator: "12:247"
      - source: imperial-gazetteer-1909
        locator: "12:248"
  - type: textual
    summary: The Kalpa Sutra says Arishtanemi passed away on the summit of Mount Girnar in the
      company of 536 monks.
    references:
      - source: jacobi-jaina-sutras-1
        locator: Kalpa Sutra, section 182, p. 279
  - type: historical
    summary: The Gazetteer gives the hill's ancient name as Ujjayanta, describes it as a sacred
      seat of the Jains second in importance to Palitana, and mentions a temple of Neminath on the
      ascent.
    references:
      - source: imperial-gazetteer-1909
        locator: "12:247"
      - source: imperial-gazetteer-1909
        locator: "12:248"
