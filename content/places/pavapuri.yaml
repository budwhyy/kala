summary_beginner: A village in Bihar that Jains hold to be the Papa where Mahavira, the last
  Tirthankara of this age, attained liberation. It is a place of Jain pilgrimage with temples.
summary_scholar: The Kalpa Sutra names the town of Papa; the identification with the present
  village is the Jain tradition recorded in the Gazetteer and is not independently verified
  here. The Gazetteer's "buried" reflects its own wording and not the Jain account of liberation.
