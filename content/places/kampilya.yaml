summary_beginner: "A village in Farrukhabad district, Uttar Pradesh, that tradition and nineteenth-century scholars identify with Kampilya, Drupada's capital, where Draupadi chose her husband."
summary_scholar: "The point is the Imperial Gazetteer's position for Kampil. The identification rests on the name and on local tradition reported by Cunningham and the Gazetteer; the ruins and coins show an old settlement but do not verify the epic events. Classed as traditional, not verified."
