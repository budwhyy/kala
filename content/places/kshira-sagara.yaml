summary_beginner: The sea of milk of the Puranas, the ocean the gods and asuras churn in the Vishnu Purana and the Ramayana. It is a sea of the stories, not a place on Earth.
summary_scholar: Wilson's translation renders it as the sea of milk (1.9, 3.17) and Griffith as the milky sea (1.45; his note describes it as one of the seven seas, each surrounding a world). The Mahabharata's account speaks only of the Ocean.
