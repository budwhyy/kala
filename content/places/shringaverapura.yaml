summary_beginner: The town on the Ganga where, in the Ramayana, the boatman-chief Guha welcomes Rama, Sita and Lakshmana and ferries them across. Tradition places it at Singraur, upstream of Prayagraj.
summary_scholar: The identification with Singraur rests in our sources on Griffith's footnote; the coordinates are those of the present-day village. No excavation report is among our sources, so the place is kept 'traditional', and nothing here verifies the epic events set there.
references:
  - source: griffith-ramayana
    locator: "2.50"
  - source: griffith-ramayana
    locator: "2.83"
