evidence:
  - type: historical
    summary: "The Imperial Gazetteer describes Amarkantak in Rewah State as famous for the source of the Narbada and one of the most sacred spots in India, with eleven places in the neighbourhood regularly visited by pilgrims, including the Narbada's source tank, the falls of Kapildhara and Son Munda where the Son rises. It records a temple of three sanctuaries arranged like a trefoil, said to have been built by a Chedi ruler named Kama or Karna Deo in 1040-70 (the scan reads 'Kama') and about fourteen other temples near it."
    references:
      - source: imperial-gazetteer-1909
        locator: "5:274"
  - type: textual
    summary: "The Devi Bhagavata gives the Devi's name at Amarakantaka as Chandika (7.30). The identification of that place with this hill is traditional."
    references:
      - source: vijnanananda-devi-bhagavata
        locator: "7.30"
