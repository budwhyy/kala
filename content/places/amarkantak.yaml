summary_beginner: "A plateau in central India where the Narmada and Son rivers rise, a pilgrimage place with a cluster of old temples."
summary_scholar: "The date 1040-70 for the principal temple is the Gazetteer's attribution, quoting Cunningham's survey report; the Narmada-Bai temple is thought older but could not be examined."
