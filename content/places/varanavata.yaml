summary_beginner: "The town where, in the Mahabharata, the Pandavas were sent to stay in a house of lac built to burn them. Scholars have identified it with Barnawa in western Uttar Pradesh, but the identification is not confirmed."
summary_scholar: "Only one identification (Barnawa) is recorded in the sources KĀLA holds, and it rests on the similarity of the name, as reported by Lal, not on an inscription. It is classed as debated and drawn without coordinates. Painted Grey Ware at Barnawa concerns the site's early occupation, not the epic story."
