evidence:
  - type: historical
    summary: "The Imperial Gazetteer's article on Conjeeveram (Kanchipuram) in Chingleput District calls it one of the holiest places in the south and says it is placed among the seven sacred cities of India, crowded with temples and shrines. The same article records an old Jain temple in a nearby hamlet."
    references:
      - source: imperial-gazetteer-1909
        locator: "10:377-378"
  - type: textual
    summary: "Dutt's Garuda Purana (chapter 81) names Kanchipuri among the sacred cities, hills and pools."
    references:
      - source: dutt-garuda-purana
        locator: "81"
        note: "p. 210"
