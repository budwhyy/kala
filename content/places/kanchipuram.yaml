summary_beginner: "A temple city in Tamil Nadu with great Shaiva and Vaishnava shrines, counted among the seven sacred cities. It is the only one of the seven in the south."
summary_scholar: "KALA records Kanchipuram as sacred on the strength of the Gazetteer and Dutt's Garuda Purana; the Gazetteer's account of its political history (Pallava, Chola and later periods) was not read in full for this record."
references:
