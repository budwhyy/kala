evidence:
  - type: textual
    summary:
      In the Mahabharata the Pandavas are sent to Khandavaprastha, where they build a city that
      comes to be called Indraprastha.
    references:
      - source: ganguli-mahabharata
        locator: "1.209"
  - type: historical
    summary:
      Raychaudhuri, citing the Jatakas, gives the Kuru capital as Indapatta, i.e. Indraprastha or
      Indrapat near modern Delhi; Cunningham records Indraprastha as an ancient name of Delhi.
    references:
      - source: raychaudhuri-phai-1923
        locator: "68"
      - source: cunningham-ancient-geography
        locator: "51"
  - type: historical
    summary: "The Imperial Gazetteer's article on Indarpat places the ancient Indraprastha at the village of Indarpat and the Purana Qila by Delhi, judging the modern name a corruption of the old one; it adds that scarcely any of the ancient city survives and that the Pandava founding is the Mahabharata's account."
    references:
      - source: imperial-gazetteer-1909
        locator: "13:331"
