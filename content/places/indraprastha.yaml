summary_beginner: The Pandavas' city in the Mahabharata, traditionally placed in Delhi. The marker
  is at the Purana Qila area, where tradition locates Indrapat.
summary_scholar: Our sources only place Indraprastha 'near modern Delhi'; the point marks the Purana
  Qila (Indrapat) area by convention, not a confirmed site. See geography notes.
