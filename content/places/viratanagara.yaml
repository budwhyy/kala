summary_beginner: "The capital of King Virata in the Mahabharata, where the Pandavas lived in disguise. Tradition and nineteenth-century scholars identify it with Bairat in Rajasthan."
summary_scholar: "Bairat's antiquity is well attested (Asokan inscriptions, Hwen Thsang via Cunningham), but its identification with Virata's city rests on the name and tradition, so the record is classed traditional, not verified. The point is the Gazetteer's position for the town."
