        locator: "4.72"
  - type: "historical"
    summary: "Cunningham takes Bairat to be the ancient capital of Matsya and the city that Hwen Thsang visited; Raychaudhuri reports that Virata's capital has been identified with Bairat in Jaipur."
    references:
      - source: "cunningham-ancient-geography"
        locator: "338"
      - source: "raychaudhuri-phai-1923"
        locator: "29"
  - type: "archaeological"
    summary: "The Imperial Gazetteer places Bairat at 27° 27' N, 76° 12' E and reports two inscriptions of Asoka found within a mile of the town, with early coins. These show an old settlement; they do not identify it with the epic city."
    references:
      - source: "imperial-gazetteer-1909"
        locator: "6:217"
