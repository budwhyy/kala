evidence:
  - type: "textual"
    summary: "In the Mahabharata the Pandavas pass their thirteenth year in disguise at the court of Virata, king of the Matsyas, hiding their weapons in a shami tree outside his city."
    references:
      - source: "ganguli-mahabharata"
