evidence:
  - type: historical
    summary: "The Imperial Gazetteer describes the Godavari as a great river of southern India, about 900 miles long, rising behind the village of Trimbak in Nasik District. It reports that its peculiar sacredness is said to have been revealed by Rama to the sage Gautama, that every part of its course is holy, that bathing in it washes away sin, and that the Pushkaram bathing festival is held every twelfth year at Rajahmundry. The marker is placed at the source."
    references:
      - source: imperial-gazetteer-1909
        locator: "12:297-299"
  - type: textual
    summary: "Dutt's Garuda Purana (chapter 81) names the Godavari among sacred rivers and speaks of seven sanctuaries along its banks. The Devi Bhagavata gives the Devi's name in the Godavari as Trisandhya (7.30)."
    references:
      - source: dutt-garuda-purana
        locator: "81"
        note: "pp. 210-212"
      - source: vijnanananda-devi-bhagavata
        locator: "7.30"
