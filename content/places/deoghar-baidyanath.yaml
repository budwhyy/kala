summary_beginner: "A temple town in eastern India where Shiva is worshipped as Baidyanath, 'Lord of Healers'. It is the main claim in Bengal and Jharkhand to a jyotirlinga, though another Vaidyanatha shrine at Parli in Maharashtra is also claimed in later lists."
summary_scholar: "Other places also lay claim to the name Vaidyanatha in the jyotirlinga list (the Gazetteer notes the Baijnath temple at Parli). Wilson and the Gazetteer both name Deogarh, and this record follows them."
