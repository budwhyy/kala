evidence:
  - type: historical
    summary: "The Imperial Gazetteer's article on Deogarh town describes a group of twenty-two temples of Siva, forming a pilgrimage centre for Hindus from all over India. The oldest is called Baidyanath, or Baijnath, and is said to contain one of the twelve oldest lingas of Siva in India. The group is surrounded by a high wall enclosing a courtyard paved with Chunar stone."
    references:
      - source: imperial-gazetteer-1909
        locator: "11:244-245"
  - type: textual
    summary: "Wilson lists Vaidyanatha, at Deogarh in Bengal, sixth among the twelve lingas of the Nandi Upapurana and calls the temple a celebrated place of pilgrimage."
    references:
      - source: wilson-religious-sects-1861
        locator: "223"
