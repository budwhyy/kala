evidence:
  - type: historical
    summary: "The Imperial Gazetteer describes the Narbada as one of the most important rivers of India, rising at Amarkantak and reaching the sea below Broach after 801 miles. It reports that the river is said to have sprung from the body of Siva and is one of the most sacred rivers of India, some devotees ranking it above the Ganges because mere sight of it removes sin, and that devout pilgrims walk its full length (pradakshina) from the mouth to the source and back. The marker is placed at the source."
    references:
      - source: imperial-gazetteer-1909
        locator: "18:375-377"
