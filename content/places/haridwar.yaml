evidence:
  - type: historical
    summary: "The Imperial Gazetteer describes Hardwar as an ancient town and place of pilgrimage on the right bank of the Ganges where the river leaves the hills, with the pilgrim road to the Kumaun shrines passing through it. It reports that the Chinese pilgrim Hiuen Tsiang mentions a Brahmanical temple north of Mo-yu-lo that the Hindus called the gate of the Ganges, a name (Gangadwara) later used by Muslim historians, and that Abul Fazl refers to Maya, known as Haridwara."
    references:
      - source: imperial-gazetteer-1909
        locator: "13:51-52"
  - type: textual
    summary: "Dutt's Garuda Purana (chapter 81) praises bathing at Ganga-Dvara and Kankhala; Kankhal is a suburb of Haridwar. The Devi Bhagavata gives the Devi's name at Gangadvara as Ratipriya (7.30)."
    references:
      - source: dutt-garuda-purana
        locator: "81"
        note: "p. 212"
      - source: vijnanananda-devi-bhagavata
        locator: "7.30"
traditions:
  - hindu
summary_beginner: "A city where the Ganga emerges from the Himalayan foothills onto the plains, a major bathing place and the starting point for pilgrimages into the mountains. It is one of the seven sacred cities and the place where the large Kumbh gatherings are held."
summary_scholar: "Equating Maya (Mayapuri) and Gangadvara with Haridwar rests on the Gazetteer's observations and on tradition. The name's meaning is disputed: Shaivas derive it from Hara, Vaishnavas from Hari, as the Gazetteer notes."
references:
  - source: imperial-gazetteer-1909
    locator: "13:51-52"
