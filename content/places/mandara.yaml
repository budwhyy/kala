summary_beginner: The mountain the gods and asuras use as a churning staff when they churn the ocean for amrita. It is a mountain of the stories, not a place KĀLA puts on a map.
summary_scholar: MBh 1.18 describes it as a cloud-capped mountain covered in herbs and visited by gods, rising and descending eleven thousand yojanas. VP 1.9 and Ramayana 1.45 call it the staff or pole of the churning. No source read for this record places it on Earth.
