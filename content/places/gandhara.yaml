summary_beginner: An ancient region around the Peshawar valley in today's Pakistan. The marker sits
  at Pushkalavati (Charsadda), its old capital; the region's extent is not drawn.
summary_scholar: "Sources disagree on the capital: Cunningham gives Pushkalavati, Raychaudhuri (from
  the Jatakas) Takshasila. The region is historically attested, which does not verify the epic
  Gandhara."
