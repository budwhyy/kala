summary_beginner: A town on the Sarayu river in Uttar Pradesh that Hindu tradition identifies as the
  capital of Rama's family in the Ramayana.
summary_scholar: "The modern town is identified with the epic city by living tradition and, through
  Saketa, by nineteenth-century historical geography (Cunningham). Raychaudhuri notes that Ayodhya
  and Saketa both appear in Buddhist texts, so their identity is uncertain. The record is kept as
  'traditional': historical notices of the town do not verify any event of the Ramayana."
references:
