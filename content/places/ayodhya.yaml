evidence:
  - type: textual
    summary:
      Valmiki's Ramayana describes Ayodhya as the royal city of Kosala on the bank of the Sarayu
      (Sarju).
    references:
      - source: griffith-ramayana
        locator: "1.5"
  - type: historical
    summary:
      Cunningham identified the present town of Ajudhya, near Faizabad, with the ancient Ayodhya
      or Saketa visited by Chinese pilgrims, reasoning from their recorded distances.
    references:
      - source: cunningham-ancient-geography
        locator: "400"
  - type: historical
    summary:
      Raychaudhuri lists Ayodhya, on the Sarayu, among the three main cities of Kosala, and notes
      that whether Saketa and Ayodhya were one city or two is disputed.
    references:
      - source: raychaudhuri-phai-1923
        locator: "49"
      - source: raychaudhuri-phai-1923
        locator: "53"
