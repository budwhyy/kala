summary_beginner: The forest where Rama, Sita and Lakshmana lived before Sita was taken. Nashik is
  the most famous traditional site, but others are claimed.
summary_scholar: The Nashik tradition is now documented by the Imperial Gazetteer (18:410), which reports the belief that Rama lived at Nasik; it gives no historical support, and the Bhadrachalam tradition remains undocumented in our sources.
references:
