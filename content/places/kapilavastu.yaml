evidence:
  - type: archaeological
    summary: The Imperial Gazetteer records that an older identification with Bhuila Dih in Basti
      District was abandoned, and that after the 1895 Nigliva and 1896 Lumbini pillar finds the city
      was placed within a few miles of Paderia, though its exact site was not yet known.
    references:
      - source: imperial-gazetteer-1909
        locator: "14:406-407"
  - type: historical
    summary: Fa-hien found the city less than a yojana east of the previous stage, almost deserted,
      with topes marking scenes of the prince's life, and the Lumbini garden fifty li to the east.
    references:
      - source: legge-fa-hien
        locator: "22"
  - type: textual
    summary: In the Nidanakatha the queen travels from Kapilavastu towards Devadaha and gives birth
      in the Lumbini grove between the two towns; the child is then taken to Kapilavastu.
    references:
      - source: rhys-davids-buddhist-birth-stories
        locator: "65-68"
traditions:
