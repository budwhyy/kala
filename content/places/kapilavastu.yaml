summary_beginner: The capital of the Sakyas and home of King Suddhodana, where Buddhist tradition
  says the future Buddha grew up. Its exact site is debated between Piprahwa in India and Tilaurakot
  in Nepal.
summary_scholar: The Gazetteer of 1908 presents the competing sites as a suggestion arising from
  disagreement between the Chinese pilgrims' accounts, not as a settled result. Later excavations
  at both sites are not covered by the sources held here.
references:
  - source: imperial-gazetteer-1909
    locator: "14:406-407"
  - source: legge-fa-hien
    locator: "22"
