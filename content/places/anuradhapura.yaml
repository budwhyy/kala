summary_beginner: The ancient royal capital of Sri Lanka, full of great Buddhist stupas and monasteries, with a sacred Bo tree said to come from India.
summary_scholar: The ruins and Fa-hien's description are historical evidence for the city and its monasteries. The tradition that its Bo tree grew from a cutting of the tree of the Buddha's awakening is recorded here, not verified.
