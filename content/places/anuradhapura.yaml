    summary: Fa-hien, who stayed in Ceylon in the early fifth century, describes the royal city with the Abhayagiri monastery of five thousand monks and a tree grown from a slip a former king obtained from Central India. Legge's notes identify it with the Bo tree that still survives in Ceylon.
