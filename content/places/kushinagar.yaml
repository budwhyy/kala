summary_beginner: The place in north India where Buddhist tradition says the Buddha passed away.
  Pilgrims today visit it at Kushinagar, near Kasia in Uttar Pradesh.
summary_scholar: The pilgrim records and Cunningham's 1871 identification with Kasia are the
  basis here, and the 1908 Gazetteer noted a mismatch with the Chinese descriptions; sources not
  read here may have settled the question since, so this record is held at debated. The Buddha's
  passing is a traditional account and is not verified by the site.
