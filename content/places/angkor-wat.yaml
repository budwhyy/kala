    summary: The 1911 Britannica describes the ruins of Angkor north of the Great Lake, among them the three-tiered temple of Angkor-Vat, whose reliefs show gods, people, animals, battles and legendary episodes. It reports that the temple was first dedicated to Brahma and later to the Buddha.
