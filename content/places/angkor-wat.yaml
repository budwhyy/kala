summary_beginner: The great stone temple at Angkor, in present-day Cambodia, built by the Khmer in the twelfth century. Its carved galleries show battles and legendary scenes.
summary_scholar: The sources read describe the reliefs only as combats and legendary episodes and do not name the Ramayana or Mahabharata; identifying particular epic scenes needs a source not yet read. Cambodia is named for orientation only; the Khmer kingdom of Angkor is not presented as the modern state.
references:
  - source: britannica-1911
    locator: "2: Angkor"
