summary_beginner: The vast terraced Buddhist monument in central Java, carved with relief panels and crowned by bell-shaped stupas.
summary_scholar: The 1911 Britannica gives Ijzerman's estimate of the eighth to tenth centuries for the central Javanese temple groups, and a possible mention in an inscription of 656. No firm date is stored here.
references:
