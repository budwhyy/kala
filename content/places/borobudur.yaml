    summary: The 1911 Britannica describes Boro Budur as a terraced monument about 150 feet high, with a central dome ringed by bell-shaped cupolas and reliefs forming a Mahayana Buddhist picture-book. Its buried base was found in 1885, and the reliefs were systematically uncovered from 1896.
    references:
      - source: britannica-1911
        locator: "15: Java"
