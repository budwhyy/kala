summary_beginner: In Buddhist cosmology, a heaven where, the Nidanakatha says, the future Buddha
  lived in his last life before his birth as Siddhattha, and where the gods came to beg him to
  become a Buddha. Not a place on Earth.
summary_scholar: Rhys Davids renders it the "City of Delight"; the Nidanakatha also says the
  Buddha's mother was reborn there seven days after his birth.
