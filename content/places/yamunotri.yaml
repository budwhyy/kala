evidence:
  - type: historical
    summary: "The Imperial Gazetteer's article on Jamnotri describes a small wooden temple in Tehri State, on the western flank of the peak Bandarpunch at about 10,800 feet, four miles below the glacier from which the Jumna issues. It contains an image of the goddess Jumna, there are hot springs nearby, and many pilgrims visit the sacred place every summer."
    references:
      - source: imperial-gazetteer-1909
        locator: "14:51"
  - type: traditional
    summary: "The Gazetteer's article on the Jumna says the river flows past the sacred shrine of Jamnotri after rising on Bandarpunch."
    references:
      - source: imperial-gazetteer-1909
        locator: "14:232-233"
