summary_beginner: "A coastal town in Odisha built around the temple of Jagannath, 'Lord of the World', a form of Vishnu-Krishna worshipped with his brother Balabhadra and sister Subhadra. Its Rath Yatra, in which the deities are drawn out on great chariots, is among the best known festivals in India."
summary_scholar: "This record rests on the Gazetteer's description of the town and its pilgrimage. It does not state when the first temple was built."
