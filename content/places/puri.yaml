evidence:
  - type: historical
    summary: "The Imperial Gazetteer's article on Puri Town describes it as celebrated for the great temple of Jagannath, to which many thousands of pilgrims come at the two chief festivals; it notes the dragging of the cars and the sanitary difficulties of the crowds, and calls the shrine of Jagannath a pilgrimage place known in every hamlet in India."
    references:
      - source: imperial-gazetteer-1909
        locator: "20:408-412"
  - type: traditional
    summary: "Wilson lists Jagannath in Orissa among the Vaishnava temples famous as pilgrimage places, and the Gazetteer's Dwarka article records the math founded at Jagannath in the east by Sankaracharya."
    references:
      - source: wilson-religious-sects-1861
        locator: "39"
      - source: imperial-gazetteer-1909
        locator: "11:387"
