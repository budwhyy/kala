summary_beginner: "A river island on the Narmada whose shape is likened to the sacred syllable Om, with a Shiva temple counted among the twelve jyotirlingas. Pilgrims come for the river as well as the shrine."
summary_scholar: "Wilson notes that the textual Omkara was placed at Ujjain by some and identifies this island shrine with it only as probable."
