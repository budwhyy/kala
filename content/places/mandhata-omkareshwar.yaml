evidence:
  - type: historical
    summary: "The Imperial Gazetteer describes Mandhata as a well-known Hindu place of pilgrimage on an island and south bank of the Narbada in Nimar District, which contains one of the twelve celebrated lingas of Siva. It notes the temple of Siddhanath, the more recent temple of Onkar on the island, a large October fair, and the former practice of devotees throwing themselves from the cliffs, last witnessed in 1824."
    references:
      - source: imperial-gazetteer-1909
        locator: "17:152"
  - type: traditional
    summary: "Wilson's list of twelve lingas has Omkara fourth; he says it is said to have been in Ujjain but is probably the shrine of Mahadeo at Omkara Mandatta on the Narmada."
    references:
      - source: wilson-religious-sects-1861
        locator: "223"
