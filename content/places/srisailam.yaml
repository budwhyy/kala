summary_beginner: "A hill temple in the Nallamalai forests above the Krishna river, where Shiva is worshipped as Mallikarjuna. It is counted among the twelve jyotirlingas and, in the Devi Bhagavata, among the seats of the Goddess."
summary_scholar: "Equating the 'Srisaila' of the texts with this temple is the traditional identification followed by Wilson and the Gazetteer."
