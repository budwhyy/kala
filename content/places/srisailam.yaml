evidence:
  - type: historical
    summary: "The Imperial Gazetteer describes Srisailam as a famous temple in the Nandikotkur taluk of Kurnool District, on the northern plateau of the Nallamalai hills above a gorge of the Kistna, with a temple 660 feet by 510 feet whose walls are sculptured with scenes from the Ramayana and Mahabharata. The central shrine is that of Mallikarjuna, the name by which Siva is worshipped here, and the Sivaratri festival draws many pilgrims."
    references:
      - source: imperial-gazetteer-1909
        locator: "23:110"
  - type: textual
    summary: "Wilson lists Mallikarjuna, or Sri Saila, as the second of the twelve lingas of the Nandi Upapurana. Dutt's Garuda Purana (chapter 81) names Shreeshailam among important sacred hills. The Devi Bhagavata gives the Devi's name at Srisaila as Madhavi (7.30)."
    references:
      - source: wilson-religious-sects-1861
        locator: "223"
      - source: dutt-garuda-purana
        locator: "81"
        note: "p. 210"
      - source: vijnanananda-devi-bhagavata
        locator: "7.30"
