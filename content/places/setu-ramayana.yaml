summary_beginner: The bridge across the sea to Lanka that Nala and the monkey army build for Rama in the Ramayana. Tradition identifies it with the chain of shoals called Adam's Bridge; this is a matter of tradition, not established fact.
summary_scholar: Kept 'debated'. Our only source for the Adam's Bridge identification is the Imperial Gazetteer's report of tradition; the text names no landing points.
