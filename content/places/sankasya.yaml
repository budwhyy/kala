summary_beginner: A place in north India where Buddhist tradition says the Buddha came back down to
  earth after a stay in heaven. The village of Sankisa is the usual candidate, but the match is
  not certain.
summary_scholar: The descent from the Trayastrimsa heaven is a traditional account; the site is an
  identification from distances and mounds. Fa-hien and Xuanzang differ on which staircase
  belonged to the Buddha (Cunningham 370).
