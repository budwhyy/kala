    argument: Cunningham identified the ruined mound at Sankisa with the capital that Fa-hien
      calls Sankasya and Xuanzang calls Kapitha, and found an elephant capital that he took to
      belong to the Asokan pillar the pilgrims mention. The Gazetteer notes that the
      identification rests on measurements and directions that are not definite and has been
      doubted.
