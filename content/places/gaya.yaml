summary_beginner: "A town in Bihar where Hindus perform rites for their ancestors beside the Vishnupada temple. It lies next to Bodh Gaya, which is sacred to Buddhists and is recorded separately."
summary_scholar: "Gaya is also a major Buddhist site; this record concerns only its Hindu pilgrimage. The Gazetteer's legend of the demon Gaya is told from the Vayu Purana, for which KALA has no public-domain English translation, so the story is not retold beyond the Gazetteer."
references:
