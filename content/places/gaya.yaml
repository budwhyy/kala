evidence:
  - type: historical
    summary: "The Imperial Gazetteer describes Gaya on the Phalgu river as a town whose old quarter holds the Vishnupada temple built over a footprint of Vishnu on the rock, and says pilgrims come from every part of India to offer funeral cakes (pindas) at forty-five places in the Gaya-kshettra, though most now visit seven or three. It notes the temple was built in the eighteenth century on an older site, and also that Buddhism flourished around Gaya for centuries."
    references:
      - source: imperial-gazetteer-1909
        locator: "12:208-210"
  - type: textual
    summary: "The Gazetteer relays the legend (from the Vayu Purana) of the demon Gaya, whose body became the holy ground. The Devi Bhagavata gives the Devi's name in Gaya Kshetra as Mangala (7.30)."
    references:
      - source: imperial-gazetteer-1909
        locator: "12:208-210"
      - source: vijnanananda-devi-bhagavata
        locator: "7.30"
