summary_beginner: "A great city of ancient India on the Yamuna, celebrated in Buddhist and Hindu texts; the ruins at Kosam are generally taken to be its site."
summary_scholar: "The Gazetteer (1908) noted that Xuanzang's distances pointed elsewhere and that one writer had proposed Gurgi in Rewa. Later excavation at Kosam is not covered by the sources read here, so the place is kept as debated."
