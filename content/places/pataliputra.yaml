    summary: "Ashoka's rock-edict V shows his capital was Pataliputra, and Hultzsch notes its identity with modern Patna. The Gazetteer summarises Megasthenes' description of the walled city at the Son-Ganges confluence and Waddell's identification of Maurya remains at Kumrahar and elsewhere."
