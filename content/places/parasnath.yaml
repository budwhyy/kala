summary_beginner: A hill in eastern India, now in Jharkhand, that is one of the holiest Jain
  pilgrimage places. Jains hold that many of the Tirthankaras attained liberation on its peaks.
summary_scholar: The Kalpa Sutra names Mount Sammeta for Parshva; the identification with the
  hill now called Parasnath rests on the Gazetteer's report of its older name. In the Gazetteer
  the hill is placed in the Hazaribagh district of Bengal. The count of ten Tirthankaras is the
  Gazetteer's report of Jain belief; the Kalpa Sutra passage read names only Parshva.
