  - type: textual
    summary: The Vishnu Purana says the old city of Kusasthali came to be known as Dwaraka; Wilson's
      note places it on the coast of Gujarat. Krishna builds Dwaraka when Mathura is threatened.
    references:
      - source: wilson-vishnu-purana
        locator: "4.1"
      - source: wilson-vishnu-purana
        locator: "5.23"
  - type: textual
    summary: In the Mahabharata (Sabha Parva) the Yadavas, fearing Jarasandha, withdraw west to
      Kusasthali near the Raivata hills, called Dwaravati.
    references:
      - source: ganguli-mahabharata
        locator: "2.14"
  - type: traditional
    summary: Living tradition identifies the epic city with the temple town of Dwarka on the Gujarat coast.
    references:
      - source: wilson-vishnu-purana
        locator: "4.1"
        note: Wilson's note on Kusasthali/Dwaraka
