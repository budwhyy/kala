    summary:
      B. B. Lal's excavation (1950-52) found a settlement whose second period, marked by Painted
      Grey Ware, he dated to about 1100-800 BCE and which ended in a flood of the Ganga.
    references:
      - source: lal-hastinapura-1955
        locator: "23"
  - type: archaeological
    summary: The report's editorial notes warn that the excavation has no bearing on whether the
      Mahabharata story is true.
    references:
      - source: lal-hastinapura-1955
        locator: "2"
        note: Notes preceding the report
  - type: textual
    summary:
      The Mahabharata and the Vishnu Purana say the city was founded by, and named after, King
      Hastin.
    references:
