summary_beginner: An excavated ancient town in Uttar Pradesh, identified with the Kuru capital of
  the Mahabharata. The dig shows people lived there long ago; it does not prove the epic's events
  happened.
summary_scholar: Verified as an ancient site by Lal's stratified excavation. Lal's own report
  cautions that the Painted Grey Ware levels and the flood do not authenticate the epic narrative.
  Puranic tradition that Hastinapura was washed away by the Ganga is noted by Raychaudhuri and
  Cunningham.
