summary_beginner: "A town on the Tunga river in Karnataka known for the math traditionally founded by Adi Shankara, the southern seat among the four maths."
summary_scholar: "The Gazetteer attributes the math to the eighth century on tradition; its own documented dates in the article are the Vijayanagar-era inscription of 1346 and the mention of 1336."
