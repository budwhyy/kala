evidence:
  - type: historical
    summary: "The Imperial Gazetteer describes Sringeri town on the Tunga river in Mysore, whose dominant institution is the math said to have been established in the eighth century by Sankaracharya, seat of the Jagad Guru of the Smarta Brahmans. It records an inscription granting the tract to the math by Harihara of Vijayanagar in 1346, and the later role of its head Madhava or Vidyaranya in founding Vijayanagar in 1336."
    references:
      - source: imperial-gazetteer-1909
        locator: "23:105-106"
  - type: traditional
    summary: "The Gazetteer's Dwarka article names Sringeri in Mysore as the southern of the four maths founded by Sankaracharya."
    references:
      - source: imperial-gazetteer-1909
        locator: "11:387"
