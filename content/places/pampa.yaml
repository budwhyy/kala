      - source: imperial-gazetteer-1909
        locator: "24:313-314"
evidence:
  - type: textual
    summary: In Valmiki's Ramayana Rama and Lakshmana, sent on by Kabandha, reach Pampa, meet the ascetic Shabari on its western side and then walk by its shores below Rishyamukha.
    references:
      - source: griffith-ramayana
        locator: "3.75"
      - source: griffith-ramayana
        locator: "3.76"
      - source: griffith-ramayana
        locator: "4.1"
  - type: textual
    summary: Griffith's footnote reports the commentator's view that Pampa names both a lake and a brook that flows into it from Rishyamuka.
    references:
      - source: griffith-ramayana
        locator: "4.1"
        note: footnote 522
traditions:
