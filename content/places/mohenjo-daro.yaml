summary_beginner: "One of the largest cities of the Indus civilisation, in Sindh, Pakistan, famous for its planned streets, drains and the Great Bath. Its identification as a Harappan site is archaeological; any link to places or peoples in the Vedas or Puranas is debated and is not made here."
summary_scholar: "Marshall provisionally dated the occupation to about 3250-2750 BC from seals found in Mesopotamia; later work revised this. He argued the Indus civilisation was pre-Vedic; the relation remains debated. Archaeology alone defines this culture. Links between Harappan sites and Vedic or Puranic places and peoples are debated and are not asserted in KALA."
