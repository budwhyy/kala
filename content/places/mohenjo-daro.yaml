    summary: "A huge city built of unbaked brick in the third millennium BC, with a citadel on high embankments, ramparts and a strictly planned lower town (UNESCO, inscribed 1980). Marshall gives its position on the 'Island' between the Indus and the Western Nara loop and tells how R. D. Banerji's digging beneath a Buddhist stupa revealed the older city."
