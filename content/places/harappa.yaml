    summary: "The Imperial Gazetteer describes brick ruins about three miles round, with a mound up to 60 feet high enclosing massive brick walls, and early coins in the debris. Marshall records that Daya Ram Sahni's excavation there showed its remains, including inscribed seals, belonged to the Chalcolithic age, which led to the recognition of Mohenjo-daro."
