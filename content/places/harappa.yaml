summary_beginner: "A great city of the Indus civilisation in the Punjab of Pakistan, which gave the civilisation its name. Its identification as a Harappan site is archaeological; any link to places or peoples in the Vedas or Puranas is debated and is not made here."
summary_scholar: "The 1908 Gazetteer knew only the mounds and a local tradition of an eponymous Raja Harappa; Sahni's excavations revealed the Indus civilisation. Archaeology alone defines this culture. Links between Harappan sites and Vedic or Puranic places and peoples are debated and are not asserted in KALA."
