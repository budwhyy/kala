alternative_identifications:
  - label: Set-Mahet, on the Rapti (Gonda and Bahraich districts)
    confidence: debated
    geometry:
      type: Point
      coordinates:
        - 82.02
        - 27.52
    argument: Cunningham identified the ruined city of Sahet-Mahet with Sravasti from its distance
      from Ayodhya and from a colossal Buddha statue there bearing an inscription with the name
      Sravasti. The Gazetteer notes excavation by Hoey in 1884-5 but says the word on the pedestal
      is not conclusive.
    references:
      - source: cunningham-ancient-geography
        locator: "409"
      - source: imperial-gazetteer-1909
        locator: "22:181"
  - label: Upper course of the Rapti, within Nepal
    confidence: debated
    modern_admin:
      country: Nepal
    argument: After the approximate site of Kapilavastu was discovered, doubts about Set-Mahet grew
      and it was suggested that Sravasti be sought on the upper Rapti in Nepal; no site is fixed.
    references:
      - source: imperial-gazetteer-1909
        locator: "22:181"
      - source: imperial-gazetteer-1909
        locator: "23:97"
evidence:
  - type: historical
    summary: Fa-hien found Shravasti with only a couple of hundred families, and the Gazetteer
      adds that Xuanzang found it deserted. Fa-hien lists the Jetavana vihara and the place of
      Angulimala's passing among the memorials there.
    references:
      - source: legge-fa-hien
        locator: "20"
      - source: imperial-gazetteer-1909
        locator: "22:181"
