summary_beginner:
  An ancient city of the kingdom of Kosala in north India where the Buddha is said to
  have spent many rainy seasons at the Jetavana garden. Where exactly it stood is still debated.
summary_scholar: The sources held here do not fix the site. Set-Mahet was long accepted, but the
  1908 Gazetteer records the doubts and calls the site uncertain. Buddhist and Jain traditions
  both remember Shravasti, in separate accounts that are not merged.
