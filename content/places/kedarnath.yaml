summary_beginner: "A Shiva temple among the snow peaks of Garhwal, one of the twelve jyotirlingas in the list Wilson reports and the third shrine of the Chota Char Dham. Local tradition, as the Gazetteer records, links it to the Pandavas and to the body of Shiva in the form of a buffalo."
summary_scholar: "The Pandava buffalo story is attributed by the Gazetteer to local tradition and is not dated here. Wilson's 'Kedaresa' is placed only vaguely ('in the Himalaya'), so the equation with this temple is his and later tradition's, not the text's."
