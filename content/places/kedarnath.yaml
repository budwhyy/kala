evidence:
  - type: historical
    summary: "The Imperial Gazetteer describes Kedarnath as a famous temple and place of pilgrimage in Garhwal, at about 11,753 feet below the snow peak Mahapanth. It reports the local tradition that Sadasiva, a form of Siva, fleeing the Pandavas in the form of a buffalo, left his hind quarters on the surface here, and that other parts of his body are revered at Tungnath, Rudranath, Madhyamaheshwar and Kalpeshwar."
    references:
      - source: imperial-gazetteer-1909
        locator: "15:196"
  - type: textual
    summary: "Wilson's list of twelve lingas from the Nandi Upapurana ends with Kedaresa, or Kedaranath, in the Himalaya, whose deity is a shapeless mass of rock."
    references:
      - source: wilson-religious-sects-1861
        locator: "224"
  - type: textual
    summary: "Dutt's translation of the Garuda Purana (chapter 81) says the sanctuary at Kedara absolves a pilgrim of all sins. The identification of that Kedara with this valley is traditional."
    references:
      - source: dutt-garuda-purana
        locator: "81"
        note: "p. 209"
traditions:
  - shaiva
