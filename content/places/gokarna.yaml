evidence:
  - type: historical
    summary: "The Imperial Gazetteer describes Gokarn in North Kanara as a place of pilgrimage frequented by devotees from all parts of India, with the Dravidian-style Mahabaleshwar temple famed as holding a fragment of the original linga given to Ravana by Siva, and counted as one of the twelve famous lingams of all India. It adds that Gokarn is mentioned in the Ramayana and Mahabharata and has twenty smaller shrines and thirty holy bathing places."
    references:
      - source: imperial-gazetteer-1909
        locator: "12:307"
  - type: textual
    summary: "Dutt's Garuda Purana (chapter 81) names Gokarna among sacred hills and cities. The Devi Bhagavata gives the Devi's name at Gokarna as Bhadrakarnika (7.30)."
    references:
      - source: dutt-garuda-purana
        locator: "81"
        note: "p. 211"
      - source: vijnanananda-devi-bhagavata
        locator: "7.30"
