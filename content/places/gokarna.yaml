summary_beginner: "A coastal town in Karnataka with the Mahabaleshwar temple, where tradition says a part of the linga that Shiva gave to Ravana came to rest. The Gazetteer counts its linga among the twelve famous ones."
summary_scholar: "Gokarna does not appear in Wilson's list of twelve nor, to KALA's knowledge, in the list used in India today; it is recorded only because the Imperial Gazetteer says so."
references:
