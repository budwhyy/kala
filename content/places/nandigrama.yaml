summary_beginner: The village near Ayodhya from which, in the Ramayana, Bharata rules as regent in Rama's name, keeping Rama's sandals. Tradition places it at Nandigram (Bharatkund), south of Ayodhya.
summary_scholar: Griffith identifies it with "Nundgaon, in Oudh" without further detail; the coordinates are those of the present-day village of Nandigram (Bharatkund) in Ayodhya district, which our sources do not describe. Kept 'traditional'.
references:
  - source: griffith-ramayana
    locator: "2.115"
