      - source: griffith-ramayana
        locator: "2.56"
      - source: griffith-ramayana
        locator: "2.94"
  - type: traditional
    summary: Living tradition identifies the hill of Kamadgiri at Chitrakoot on the Mandakini as the site.
    references:
      - source: griffith-ramayana
        locator: "2.56"
        note: textual setting only; modern identification is living tradition
  - type: traditional
    summary: "The Imperial Gazetteer's article on Chitrakut hill in Banda District says the hill's sanctity is held to date from Rama and Sita's visit during their wanderings, and that it was formerly the most frequented place of pilgrimage in Bundelkhand."
    references:
      - source: imperial-gazetteer-1909
        locator: "10:300"
