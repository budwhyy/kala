evidence:
  - type: historical
    summary: "The Imperial Gazetteer describes the mountain temple of Gangotri, in Tehri State, on the right bank of the Bhagirathi eight miles from its source in the Gaumukh glacier, at about 10,319 feet. The temple holds small statues of Ganga, Bhagirathi and others, and was erected by Amar Singh Thappa, a Gurkha commander; many pilgrims come in summer, and flasks of the sacred water are sealed and carried away."
    references:
      - source: imperial-gazetteer-1909
        locator: "12:140"
  - type: traditional
    summary: "The Gazetteer's article on the Ganges lists Gangotri, near the source, among the principal bathing resorts on the river."
    references:
