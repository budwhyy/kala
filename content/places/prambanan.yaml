    summary: The 1911 Britannica describes the Brambanan temple complex between Surakarta and Jokjakarta, with three walls, many small shrines and a central group of larger temples. The main temple is mostly Shaiva and is popularly called Lara Janggrang after Durga. Chandi Sewu lies to the north.
    references:
      - source: britannica-1911
        locator: "15: Java"
traditions:
