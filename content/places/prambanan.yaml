  - shaiva
summary_beginner: The great Hindu temple complex of central Java, whose main temple is dedicated chiefly to Shiva.
summary_scholar: The source read does not mention Ramayana reliefs at Prambanan; that claim awaits a public-domain source. The 1911 Britannica's dates are inconsistent (a tradition of 1266-1296 beside Ijzerman's eighth-to-tenth-century estimate for central Javanese temples), so no date is stored.
references:
