evidence:
  - type: archaeological
    summary: Ruins of a large stone stupa and a monastery, with new inscriptions of Asoka and
      Kanishka found in 1905, are described in the Imperial Gazetteer, which identifies Sarnath
      with the deer park (Mrigadava) where the Buddha is said to have first taught, with the
      Isipattana monastery nearby.
    references:
      - source: imperial-gazetteer-1909
        locator: "22:109"
  - type: historical
    summary: Fa-hien describes the deer park of the rishis a little north-east of Varanasi, and
      Xuanzang describes the monastery of the stag grove with an Asokan stupa and pillar.
    references:
      - source: legge-fa-hien
        locator: "34"
      - source: beal-si-yu-ki
        locator: "2:42"
