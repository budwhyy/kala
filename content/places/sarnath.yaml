summary_beginner: The site just north of Varanasi where Buddhist tradition says the Buddha gave his
  first teaching, the turning of the wheel of the Dhamma. It is one of the four great Buddhist
  pilgrimage places.
summary_scholar: The monastery and stupa remains and the Asokan inscriptions are historically
  attested; the Buddha's first sermon is a traditional account that is not verified here. Sarnath
  is a separate place from Kashi, which is the city of Hindu pilgrimage.
references:
  - source: imperial-gazetteer-1909
    locator: "22:109"
