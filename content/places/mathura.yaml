evidence:
  - type: historical
    summary:
      The Chinese pilgrim Hwen Thsang (seventh century CE) described Mathura as the capital of a
      large kingdom; Cunningham matched his account to the present city on the Jumna.
    references:
      - source: cunningham-ancient-geography
        locator: "373"
  - type: archaeological
    summary: Cunningham reports mounds around the city that yielded statues and remains of large buildings.
    references:
      - source: cunningham-ancient-geography
        locator: "374"
  - type: textual
    summary:
      In the Vishnu Purana Shatrughna takes Mathura, the capital of Madhu's son; later chapters
      set Krishna's youth around Mathura and Jarasandha's sieges of it.
    references:
      - source: wilson-vishnu-purana
        locator: "4.4"
      - source: wilson-vishnu-purana
        locator: "5.22"
