summary_beginner: An old city on the Yamuna in Uttar Pradesh, revered as the birthplace of Krishna.
  Its ancient history is well documented.
summary_scholar: Mathura's identification rests on historical records (Hwen Thsang via Cunningham)
  and archaeological finds. That evidence concerns the historical city only; it does not verify the
  Krishna narratives set there.
