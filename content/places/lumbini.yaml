evidence:
  - type: archaeological
    summary: A pillar inscribed to show that Asoka raised it at the Lumbini garden to mark the
      Buddha's birthplace was found in 1896 north of Paderia in Nepal. The Imperial Gazetteer
      notes that the place is still called Rummin-dei and that the pillar is split, as Xuanzang
      described.
    references:
      - source: imperial-gazetteer-1909
        locator: "14:407"
  - type: historical
    summary: Fa-hien places the garden of Lumbini fifty li east of Kapilavastu, and Xuanzang
      describes a stone pillar topped by a horse beside the stupas of the birth, damaged in the
      middle.
    references:
      - source: legge-fa-hien
        locator: "22"
      - source: beal-si-yu-ki
        locator: "2:25"
  - type: textual
    summary: The Mahaparinibbana Sutta speaks of the place where the Tathagata was born as the
      first of four places a faithful person may visit; the sutta gives the event, not the name.
    references:
      - source: rhys-davids-buddhist-suttas
        locator: "5.17"
