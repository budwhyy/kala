summary_beginner: The garden in present-day Nepal that Buddhist tradition names as the Buddha's
  birthplace. An inscribed pillar of Asoka found there marks it as a place of pilgrimage from the
  earliest historical records.
summary_scholar: The location is historically well attested by the inscribed pillar, and the
  account of the Buddha's birth is a traditional one that this record does not verify. Cunningham,
  writing in 1871 before the pillar was found, proposed a site near Nagar in India for the
  garden; the 1896 discovery superseded that proposal (Cunningham 416-417; Imperial Gazetteer
  14:407).
references:
  - source: imperial-gazetteer-1909
    locator: "14:407"
  - source: legge-fa-hien
    locator: "22"
