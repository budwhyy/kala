    summary: The Imperial Gazetteer describes the hill of Shetrunja (Satrunjaya) at the foot of
      which lies Palitana, its summit covered with Jain temples, the most famous being those of
      Adinath, Kumar Pal, Vimalasah, Sampriti Raja and the Chaumukh, and quotes Burgess on the
      steps, shrines and footprint cells along the ascent.
