summary_beginner: A hill in Gujarat covered with Jain temples, the most sacred of the five holy
  hills of the Jains according to the Imperial Gazetteer. It is dedicated chiefly to Adinath
  (Rishabha), the first Tirthankara, and Jains hold it a duty to make a pilgrimage there.
summary_scholar: The Gazetteer reports the hill's sanctity and the custom of building temples
  there, and gives no founding dates in the passages read; the dates of individual temples were
  not confirmed. The pilgrimage is described as of living Jain practice. The Gazetteer does not
  list the other four of the five hills, so no list network is entered for them. Hindu and Muslim
  shrines on the path are also noted there.
references:
  - source: imperial-gazetteer-1909
    locator: "19:361"
