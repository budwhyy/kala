evidence:
  - type: archaeological
    summary: Cunningham identified the village of Baragaon, seven miles north of Rajgir and ringed
      with tanks and mounds, with Xuanzang's Nalanda, traced the great monastery's courtyards on
      the ground, and found two inscriptions on the spot that call the place Nalanda.
    references:
      - source: cunningham-ancient-geography
        locator: "468"
      - source: cunningham-ancient-geography
        locator: "469"
      - source: cunningham-ancient-geography
        locator: "470"
  - type: historical
    summary: Xuanzang describes the Nalanda sangharama, its tank and the legend of the naga after
      whom it is named; Fa-hien mentions the village of Nala where Sariputra was born.
    references:
      - source: beal-si-yu-ki
        locator: "2:166"
      - source: legge-fa-hien
