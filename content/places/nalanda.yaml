summary_beginner: The ruins in Bihar of a great Buddhist monastery and centre of learning, near
  Rajgir, described by Chinese pilgrims in the seventh century.
summary_scholar: The location is attested by the ruins and by inscriptions naming the place
  (Cunningham 469). The Kalpa Sutra also names the suburbs of Nalanda beside Rajagriha as a Jain
  rainy-season stay of Mahavira; that Jain Nalanda is not separately tagged here.
