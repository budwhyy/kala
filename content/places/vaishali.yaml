  - type: historical
    summary: Cunningham identified the village of Besarh, with its ruined fort called the fort of
      Raja Bisal, as Vaisali from Xuanzang's distances and directions and from the size of the old
      fort, which fits the circuit given for the royal palace.
    references:
      - source: cunningham-ancient-geography
        locator: "443"
  - type: historical
    summary: Fa-hien describes the city of Vaisali, the garden of Ambapali and the double-galleried
      vihara, and Xuanzang gives the kingdom of Fei-she-li.
    references:
      - source: legge-fa-hien
        locator: "25"
