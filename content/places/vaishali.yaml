summary_beginner: An ancient city of north Bihar remembered in Buddhist tradition for the Buddha's
  visits, the garden of Ambapali, and a council of monks. Jains remember it as a place where
  Mahavira spent many rainy seasons.
summary_scholar: The identification with Besarh is made by name, position and the size of the fort
  (Cunningham 443). The Buddhist and Jain traditions concern the same city but are kept in
  separate networks; the Jain list pairs Vaishali with Vanijyagrama.
references:
