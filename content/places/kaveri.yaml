evidence:
  - type: historical
    summary: "The Imperial Gazetteer describes the Cauvery (Kaveri) as a great river of southern India famous for its traditional sanctity. It says devout Hindus know it as Dakshina Ganga, the Ganges of the south, that its whole course is holy ground, and that ancient temples at its source (Tala Kaveri) and at Bhagamandala are visited by pilgrims each October-November. The marker is placed at the source."
    references:
      - source: imperial-gazetteer-1909
        locator: "9:303-305"
  - type: textual
    summary: "Dutt's Garuda Purana (chapter 81) names the Kaveri among sacred rivers."
    references:
      - source: dutt-garuda-purana
        locator: "81"
        note: "pp. 210-211"
