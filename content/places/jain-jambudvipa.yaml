summary_beginner: "In the Tattvartha Sutra, the round central continent of the middle world, in which we live, one lakh yojanas across, with Mount Meru at its centre like a navel. The Kalpa Sutra places the births of the Tirthankaras 'here on the continent Jambudvipa, in Bharatavarsha'."
summary_scholar: "This is the Jain account; the Puranic Jambudvipa (Vishnu Purana 2.2) is described differently and is not merged with it here."
