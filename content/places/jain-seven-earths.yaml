summary_beginner: "In the Tattvartha Sutra, seven earths lie one below the other beneath the world we live in, each supported by three layers of air and named by its hue: jewels, sugar, sand, mire, smoke, darkness and pitch darkness. Hellish beings live in the hells within them. They belong to Jain cosmology, not to any place on Earth."
summary_scholar: "Jaini's commentary gives thicknesses in yojanas for each earth and the number of hells in each (eighty-four lakh in all). These are the Jain lower world; they are not the Puranic Patalas."
