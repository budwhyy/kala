    summary: The Imperial Gazetteer describes Sanchi and the country towards Bhilsa as the site of
      the most extensive Buddhist remains then known in India, with a great stupa enclosed by a
      railing and four carved gateways, a smaller stupa, a chaitya hall and ruined shrines. It
      adds that two monoliths may have borne edicts of Asoka.
    references:
