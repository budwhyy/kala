summary_beginner: A hilltop in central India crowned by a great Buddhist stupa and other
  monuments, among the best-preserved Buddhist remains in the country.
summary_scholar: Sanchi is not one of the sites of the Buddha's life in the sources read here and
  belongs to no network in this atlas. The Gazetteer notes, after Fergusson, that its
  survival may reflect its remote setting rather than a greater importance in Buddhist times.
