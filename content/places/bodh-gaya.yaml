evidence:
  - type: archaeological
    summary: Excavation during the 1881 restoration of the Mahabodhi temple uncovered foundations
      of an older building beneath the floor and a stone railing, part of it of the Asokan age in
      Cunningham's judgement. The Gazetteer reports these findings and the Vajrasana (throne)
      beside the Bodhi tree.
    references:
      - source: imperial-gazetteer-1909
        locator: "9:43"
      - source: cunningham-mahabodhi
        locator: vii
  - type: historical
    summary: Fa-hien describes the place of the Buddha's enlightenment near Gaya, and Xuanzang
      describes the Bodhi tree, the vihara and the surrounding monuments in the seventh century.
    references:
      - source: legge-fa-hien
        locator: "31"
      - source: beal-si-yu-ki
        locator: "2:122"
