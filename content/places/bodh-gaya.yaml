summary_beginner: The village in Bihar, India, with the Bodhi tree and the Mahabodhi temple, where
  Buddhist tradition says the Buddha attained enlightenment. It is one of the central pilgrimage
  places of Buddhism.
summary_scholar: The site of a temple and tree of worship is well attested historically and
  archaeologically; the account of the Buddha's enlightenment is a traditional one that is not
  verified here. The tree standing today is described by the Gazetteer as an offshoot of an older
  one. Cunningham's absolute dates are his own estimates and are not adopted.
references:
