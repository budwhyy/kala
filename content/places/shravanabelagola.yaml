summary_beginner: A village in Karnataka, the chief seat of Jainism in south India, with a
  colossal statue of Gomata on a hill and many temples.
summary_scholar: The Gazetteer reports a Jain tradition that Bhadrabahu died here on a migration
  south and was attended by the Maurya emperor Chandragupta, and says rock inscriptions bear this
  out without a date; this record attributes the account to that tradition and does not treat the
  identification of the emperor as established.
