    summary: The Imperial Gazetteer describes the colossal statue of Gomata, 57 feet high, on the
      hill above the village, whose foot inscriptions in several scripts name Chamundaraya as the
      builder, and temples on a second hill. It also reports rock inscriptions of great antiquity
      and a Jain tradition about Bhadrabahu.
    references:
      - source: imperial-gazetteer-1909
