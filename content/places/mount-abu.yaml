    summary: The Imperial Gazetteer describes the five Jain Delwara temples about a mile north of
      the station, naming two as unrivalled in India - the temple of Vimala Sah, built according to
      its inscription in 1032 and dedicated to Adinath, and the temple of Vastupala and Tejpala,
      built in 1231 and dedicated to Neminath.
