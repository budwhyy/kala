summary_beginner: A mountain in Rajasthan with the Dilwara (Delwara) temples, Jain shrines of
  white marble famed for their carving and still places of worship.
summary_scholar: The Gazetteer gives the foundation dates of the two chief temples from their
  inscriptions, which verifies the temples as historical monuments and not any legend. The
  mountain's other associations are not covered by the sources read here.
