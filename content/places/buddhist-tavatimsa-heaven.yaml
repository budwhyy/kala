summary_beginner: In Buddhist cosmology, a heaven of the gods. In the Nidanakatha
  its gods rejoice at the Bodhisatta's birth, Sakka enshrines his cut hair there, and his horse
  Kanthaka is reborn there. Not a place on Earth.
