evidence:
  - type: historical
    summary: "The Imperial Gazetteer describes Badrinath as a peak in Garhwal and, on one of its shoulders at about 10,400 feet, a shrine of Vishnu of the same name on the road from Srinagar to the Mana Pass. It says the original temple is said to have been built by Sankaracharya, that avalanches swept away several buildings, and that the present structure is modern; its chief priest is a Namburi Brahman from the south."
    references:
      - source: imperial-gazetteer-1909
        locator: "6:179-180"
  - type: textual
    summary: "Dutt's translation of the Garuda Purana (chapter 81) says that a pilgrimage to the holy forest of Vadarika leads to the emancipation of the self. Tradition connects Badarika with the Badrinath region; the translation does not itself name Badrinath."
    references:
      - source: dutt-garuda-purana
        locator: "81"
        note: "pp. 209-210; the identification with Badrinath is traditional, not made by the text"
  - type: traditional
    summary: "Wilson names Badarinath in the Himalaya among the temples of the Vaishnavas that are celebrated as objects of pilgrimage. The Gazetteer's Dwarka article lists Badrinath, in the north, as one of the four maths founded by Sankaracharya."
    references:
      - source: wilson-religious-sects-1861
        locator: "39"
      - source: imperial-gazetteer-1909
        locator: "11:387"
traditions:
  - vaishnava
