summary_beginner: "A temple of Vishnu high in the Garhwal Himalaya, in the same name as the peak above it, reached on foot by pilgrims for many centuries. It is the northern of the four dhams and also the last shrine of the Himalayan Chota Char Dham."
summary_scholar: "The Gazetteer's date for the first temple (Sankaracharya, i.e. the traditional eighth-century reformer) is a tradition, not a documented foundation, and it records that the present building is modern. The Garuda Purana's 'Vadarika' is a place name that Hindu tradition links with this valley; KALA keeps that link as tradition."
