evidence:
  - type: historical
    summary: "The Imperial Gazetteer describes Pushkar as a town, lake and place of pilgrimage in Ajmer District, popularly held to be the place where Brahma performed a sacrifice that made the lake so holy that bathing in it brings the greatest sinner to paradise. It lists five principal temples (to Brahma, Savitri, Badri Narayan, Varaha and Siva Atmateswara), all of modern construction because earlier buildings suffered under Aurangzeb, and a great fair in October-November."
    references:
      - source: imperial-gazetteer-1909
        locator: "21:1"
  - type: textual
    summary: "Dutt's Garuda Purana (chapter 81) names Pushkara among sacred places; the Devi Bhagavata gives the Devi's name at Pushkara as Puruhuta (7.30)."
    references:
      - source: dutt-garuda-purana
        locator: "81"
        note: "p. 210"
      - source: vijnanananda-devi-bhagavata
        locator: "7.30"
