summary_beginner: "A sacred lake and temple town in Rajasthan, linked to Brahma, with a famous temple to him. Pilgrims bathe in the lake, especially at the autumn fair."
summary_scholar: "The Gazetteer notes the common but, in its view, mistaken belief that this is the only Brahma temple in India."
references:
