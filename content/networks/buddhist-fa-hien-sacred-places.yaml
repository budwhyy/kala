summary_beginner: The holy places of the Buddha's life that the Chinese pilgrim Fa-hien visited and
  described in the early fifth century, gathered here as one traveller's record rather than as an
  official circuit.
summary_scholar: Legge's translation of Fa-hien is the source of the list. Fa-hien describes
  Shravasti and Kapilavastu as thinly peopled or desolate in his day. Xuanzang's later account, in
  Beal's translation, is cited on the place records where it adds detail.
