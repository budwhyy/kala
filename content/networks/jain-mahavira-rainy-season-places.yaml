summary_beginner: Towns in the Ganges plain where, according to the Kalpa Sutra, Mahavira spent
  the rainy season, when Jain monks do not travel. Several, such as Rajgir, Vaishali and Shravasti,
  are also remembered in Buddhist tradition.
summary_scholar: The Kalpa Sutra lists Asthikagrama, Champa and Prishthachampa, Vaishali with
  Vanijyagrama, Rajagriha with the suburbs of Nalanda, Mithila, Bhadrika, Alabhika, Panitabhumi,
  Shravasti and Papa. Only the sites that have records in this atlas are tagged; the rest await
  sources. The same cities carry Buddhist networks, kept separate.
references:
  - source: jacobi-jaina-sutras-1
    locator: Kalpa Sutra, section 122, p. 264
