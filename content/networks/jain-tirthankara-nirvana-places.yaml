summary_beginner: Places that the Kalpa Sutra names as where a Tirthankara (a Jina, a teacher who
  shows the path across rebirth) attained liberation - Mahavira at Papa, Parshva on Mount Sammeta,
  and Arishtanemi on Mount Girnar. Jains remember them as sacred tirthas.
summary_scholar: The Kalpa Sutra also names Mount Ashtapada for Rishabha; that mountain has no
  place record here because the sources read do not locate it. Later Jain tradition counts many
  more places, and those lists are not entered. Identification of the scriptural Sammeta with
  the hill now called Parasnath, and of Papa with Pawapuri, comes from the Imperial Gazetteer's
  statement of current tradition, not from the Kalpa Sutra itself.
