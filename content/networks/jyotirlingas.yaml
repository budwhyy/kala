summary_beginner: "Twelve shrines where Shaivas honour Shiva as a self-manifest 'linga of light'. The shrines are spread across India, from Kedarnath in the Himalaya to Rameswaram in the south. Different texts and traditions do not give exactly the same twelve."
summary_scholar: "Two public-domain accounts are kept apart. H. H. Wilson reports a list of twelve from the Kedara Kalpa of the Nandi Upapurana, with his identifications; it includes Amareshvara and Gautamesa. The Imperial Gazetteer, without listing the twelve, describes Mandhata, Deogarh, Bhimashankar and Gokarn as holding one of the twelve celebrated lingas. Gokarna and Bhimashankar do not appear in Wilson's list as he locates it. The list used in India today, with Nageshvara and Ghrishneshvara, is not recorded here because KALA holds no public-domain English text for it."
